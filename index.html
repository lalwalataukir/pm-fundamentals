LESSONS.push({
  id: 'pm-7', track: 'pm', n: 7, minutes: 12,
  title: 'Working with engineering and design', short: 'Engineering & design',
  sub: 'Estimation conversations, trade-offs, tech debt, design feedback, and how to say no.',
  idea: 'Bring problems and constraints, not solutions and deadlines. Negotiate the scope, never the estimate.',
  body: `
<p>Your relationship with engineers and designers <em>is</em> the job. Involve them early, share the why, and respect their expertise. If they only ever see finished tickets, you’ll get exactly what the tickets say and nothing better.</p>
<h3>Estimation conversations</h3>
<p>An estimate is a <strong>forecast under uncertainty</strong>, not a promise. Ask questions that reduce the uncertainty or the scope instead of haggling over the number:</p>
<ul>
  <li>“What makes this big? Which part is the riskiest?”</li>
  <li>“Is there a smaller version that delivers most of the value?”</li>
  <li>“What would we need to learn to be more confident, and could a short spike tell us?”</li>
  <li>“If the date is fixed, what would you cut first?”</li>
</ul>
<p>The classic trade-off triangle is scope, time and people. When the date and the team are fixed, <strong>scope flexes</strong>. Quality doesn’t. In regulated finance, cutting testing or the audit log to hit a date is the most expensive shortcut there is.</p>
<h3>Making trade-offs explicit</h3>
<p>Give decision-makers options instead of a single plan. Show the value, cost and risk of each one, and make a recommendation. A good decision depends on seeing those side by side.</p>
<h3>Tech debt</h3>
<p>Tech debt is the future cost of shortcuts and outdated design. It can be <em>deliberate</em> (we shipped fast on purpose), <em>accidental</em> (we found a better design later) or <em>bit rot</em> (dependencies and infrastructure aged). You should care because it slows every future feature and causes incidents, often at the worst moment, like month-end or quarter-end reporting.</p>
<ul>
  <li>Make it visible as backlog items that state their <strong>business impact</strong>, for example “NAV import retries fail at month-end: 3 partner escalations last quarter”.</li>
  <li>Many teams reserve a steady slice of capacity for it, often 15–25%. That’s a team practice, not a rule.</li>
  <li>Tie paydown to outcomes: “cuts report-generation failures from 3% to under 0.5%”.</li>
</ul>
<h3>Working with design</h3>
<p>Share the problem and the constraints before any screens exist. Give feedback anchored in <strong>user goals</strong>, not taste. “Can an advisor spot a failed SIP within 5 seconds on this screen?” is useful. “Make it pop” isn’t.</p>
<h3>Saying no</h3>
<p>Every yes is a no to something else. A good no: <strong>acknowledge</strong> the need, <strong>explain</strong> the trade-off against current priorities, and <strong>offer</strong> an alternative (“no, but…” or “yes, if…”) or a clear condition for revisiting it.</p>`,
  example: {
    title: '“Real-time portfolio sync” came back as an XL estimate',
    html: `
<p>A large partner asks, through the CTO, for “real-time portfolio values”. Engineers estimate 8–10 weeks.</p>
<p><strong>You ask what drives the size.</strong> Mutual fund NAVs are published once a day, so real-time isn’t even available at the source. Holdings data from the RTAs (CAMS, KFintech) arrives in batches. Live equity prices need a paid exchange data licence plus streaming infrastructure.</p>
<p><strong>You go back to the problem.</strong> In two partner calls, advisors say what they really want is to <em>trust</em> the numbers during a client call. They often don’t know when the data was last updated.</p>
${table(['Option', 'Effort', 'Value'], [
  ['A. Full real-time (live equity, intraday updates)', '8–10 weeks + licence cost', 'High, but only for equity-heavy HNI books'],
  ['B. End-of-day sync with an “as of” timestamp, plus on-demand refresh of equity holdings using delayed prices', '2–3 weeks', 'Solves trust for most advisors'],
  ['C. “Data as of [time]” timestamp only', '2 days', 'A quick trust win and a test of the hypothesis']
])}
<p><strong>Decision:</strong> C this Sprint, B next. Revisit A after measuring how many advisors manage equity-heavy books. You didn’t argue about whether it’s “really” 8 weeks. You changed the scope to fit the actual problem.</p>`
  },
  mistakes: [
    'Negotiating the estimate (“can’t you do it in a week?”) instead of the scope.',
    'Treating estimates as commitments, then blaming the team when uncertainty turns up.',
    'Bringing engineers solutions instead of problems, which throws away their best ideas.',
    'Treating tech debt as “engineering’s problem” until an outage hits during a partner’s quarter-end.',
    'Agreeing with the CTO in the meeting and then telling the team something different, or the other way round.',
    'Giving design feedback based on personal taste instead of user goals.'
  ],
  tryit: {
    prompt: `<p>Thursday evening, your CTO messages: <em>“Big partner demo next Wednesday. Can we add a ‘chat with your portfolio’ AI assistant? Should be quick with the LLM APIs.”</em></p>

LESSONS.push({
  id: 'pm-8', track: 'pm', n: 8, minutes: 12,
  title: 'Stakeholders and communication', short: 'Stakeholders',
  sub: 'Status updates, managing up, and getting sales, ops and compliance aligned.',
  idea: 'No surprises. Tell the right people the right level of detail early, especially when the news is bad.',
  body: `
<h3>Map your stakeholders</h3>
<p>Internal: your CTO, sales, customer success, operations, compliance, finance and leadership. External: partner firms and their own compliance teams. A simple way to sort them is by <strong>power and interest</strong>. Manage the high-power, high-interest people closely (your CTO, a key partner). Keep high-power, lower-interest people satisfied with brief summaries (the CEO, the CFO). Keep high-interest people informed (the CS team).</p>
<h3>Managing up</h3>
<ul>
  <li>Know your CTO’s goals and worries this quarter. Frame your updates in those terms.</li>
  <li>Bring <strong>recommendations, not just problems</strong>: “Here are two options. I recommend A because…”</li>
  <li>Ask for decisions explicitly and with a date: “I need a call on A or B by Thursday.”</li>
  <li>Agree how they want to hear from you: a written weekly note, a Slack thread, a 1:1 agenda.</li>
</ul>
<h3>A weekly update that gets read</h3>
<ol>
  <li><strong>Headline</strong>: on track, at risk or off track, in one sentence.</li>
  <li><strong>Progress vs goal</strong>, using the metric.</li>
  <li><strong>Done and next.</strong></li>
  <li><strong>Risks and asks</strong>: decisions you need, and from whom.</li>
</ol>
<p>Keep exec updates under about 150 words, with links for anyone who wants more detail.</p>
<h3>Aligning sales, ops and compliance</h3>
${table(['Group', 'What they need from you', 'What to avoid'], [
  ['<strong>Sales</strong>', 'A clear roadmap story with confidence levels, one intake channel for requests, and early access to pilots', 'Letting them commit dates or features you haven’t agreed'],
  ['<strong>Ops / Customer success</strong>', 'Launch readiness: training, FAQs, support macros, notice of changes', 'Shipping changes they discover from partners'],
  ['<strong>Compliance</strong>', 'Involvement during discovery, real examples, and their requirements written as acceptance criteria', 'Arriving the week before launch for a rubber stamp']
])}
<h3>RACI</h3>
<p><strong>R</strong>esponsible (does the work), <strong>A</strong>ccountable (makes the final call, exactly one person), <strong>C</strong>onsulted (gives input before the decision), <strong>I</strong>nformed (told afterwards). Most stakeholder pain comes from people who think they’re A when they’re C.</p>
<h3>Delivering bad news</h3>
<p>Do it early, privately first, and in this order: <strong>what happened, the impact, what we’re doing about it, and what we need</strong>. Don’t sugar-coat it, and don’t wait until you’ve fixed it.</p>`,

LESSONS.push({

  sub: 'Now / Next / Later, and why outcome-based roadmaps hold up better than feature lists.',
  idea: 'A roadmap shows which problems we’ll tackle and in what order, with confidence falling the further out you look. It’s a strategy document, not a delivery schedule.',
  body: `
<h3>What a roadmap is for</h3>
<p>A roadmap aligns people on <strong>direction and priorities</strong> and explains the trade-offs behind them. It is not a promise of dates. When it turns into one, every change becomes a broken commitment.</p>
<h3>Feature-based vs outcome-based</h3>
<p>A <strong>feature roadmap</strong> lists features with dates: “Chatbot, Q2. PDF reports, Q3.” It’s easy to read, but it commits to solutions before you’ve learned anything. An <strong>outcome roadmap</strong> lists problems to solve, each with a metric: “Cut review-prep time by 50%”. Features appear underneath as <em>bets</em>. The team is free to find the best solution, and the roadmap survives learning.</p>
<h3>Now / Next / Later</h3>
${fig(DIAG.nnl, 'Columns, not dates. Detail and confidence fall from left to right.')}
<ul>
  <li><strong>Now</strong>: committed and in progress. Well understood and high confidence.</li>
  <li><strong>Next</strong>: shaped and likely next. Medium confidence, and could change.</li>
  <li><strong>Later</strong>: problems we believe matter. Deliberately vague and low confidence.</li>
</ul>
<h3>Roadmap, backlog, release plan</h3>
${table(['Artifact', 'Horizon', 'Answers'], [
  ['Roadmap', 'Quarters', 'Which problems, in what order, and why?'],
  ['Product Goal (Scrum)', 'Months', 'What is the next objective the Scrum Team is working towards?'],
  ['Product Backlog', 'Weeks to months', 'What work, in what order?'],
  ['Sprint / release plan', 'Days to weeks', 'What ships when?']
])}
<p>Real dates do exist. Regulatory deadlines and contractual commitments should appear as <strong>explicit fixed-date items</strong>, scoped with MoSCoW so everyone knows what is negotiable.</p>
${tip('<p>Keep one roadmap with different views. Engineers need detail, executives need outcomes and metrics, and partners or sales need themes, with no dates beyond “Now”.</p>')}`,

    title: 'Turning last year’s feature list into an outcome roadmap',

<p><strong>The old roadmap:</strong> Q1 chatbot · Q2 PDF reports · Q2 SSO · Q3 WhatsApp alerts · Q3 Hindi UI · Q4 goal-planning module.</p>
${table(['Column', 'Outcome (metric)', 'Current bets'], [
  ['<strong>Now</strong>', 'Advisors prepare a review in under 15 minutes (median prep time)', 'AI meeting brief, PDF export of the brief'],

<p>“WhatsApp alerts” became “act on failed SIPs within 48 hours”. WhatsApp might still be the answer, but now it has to compete with simpler options.</p>`

LESSONS.push({
  id: 'pm-10', track: 'pm', n: 10, minutes: 12,
  title: 'Launches and iteration', short: 'Launches & iteration',
  sub: 'Release planning, feature flags, staged rollouts, and measuring impact honestly after launch.',
  idea: 'Launch is where learning starts. Release gradually behind flags, measure against success and guardrail metrics you set in advance, and then decide whether to roll forward, fix or roll back.',
  body: `
<h3>Deploy ≠ release</h3>
<p><strong>Deploying</strong> puts code into production. <strong>Releasing</strong> makes it available to users. <strong>Feature flags</strong> separate the two, so you can ship code safely and choose who sees it, when.</p>
<ul>
  <li><strong>Release flags</strong>: hide unfinished work and roll it out gradually.</li>
  <li><strong>Kill switches</strong>: turn a feature off instantly if it misbehaves.</li>
  <li><strong>Entitlement flags</strong>: per firm or per plan, such as “AI brief enabled for Firm X”.</li>
  <li><strong>Experiment flags</strong>: split traffic for a test.</li>
</ul>
<p>Remove flags once a rollout finishes. Stale flags are tech debt.</p>
<h3>Release planning and readiness</h3>
<p>Before you widen access, check: engineering is done (including monitoring and a rollback plan), compliance has signed off, CS is trained and has FAQs and support macros, help docs are ready, partner admins have been told, and dashboards exist for the metrics you’ll judge it by.</p>
<h3>Staged rollouts, B2B-style</h3>
${fig(DIAG.rollout, 'Widen access step by step. Each step has exit criteria you agreed before launch.')}
<p>In B2B, roll out <strong>by firm</strong>, not to a random 10% of users. Firms train their advisors together and admins need control, and having half a firm on the new flow creates confusion and support tickets.</p>
<h3>Measure impact honestly</h3>
<ul>
  <li>Define <strong>success metrics</strong> and <strong>guardrails</strong> before launch, with decision rules: “Pause the rollout if numeric-error reports exceed 0.5% of briefs.”</li>
  <li>Simple before/after comparisons are confounded by seasonality (quarter-end review season), market moves and training effects.</li>
  <li>Use a <strong>comparison group</strong>: firms not enabled yet in a staggered rollout, a holdout, or an A/B test if volume allows. B2B volumes are often small, so combine numbers with interviews.</li>
</ul>
<h3>After launch</h3>
<p>Watch closely for the first 48 hours. Triage feedback and bugs. Review at 30, 60 and 90 days and decide to <strong>iterate, scale or stop</strong>. For AI features, also sample outputs for human review, track drift, cost and latency, and version prompts and models so you can roll back.</p>`,
  example: {
    title: 'Rolling out the AI portfolio summary',
    html: `
${table(['Stage', 'Who', 'Exit criteria to widen'], [
  ['0 · Internal', 'CS team + 3 internal advisors, 1 week', 'Zero numeric errors in 100 sampled summaries; p95 latency under 10 s'],
  ['1 · Pilot', '3 design-partner firms, 2 weeks', '≥60% of eligible reviews use it; edit rate under 30%; compliance spot-check passes'],
  ['2 · 25% of firms', 'Admin opt-in, 2 weeks', 'Guardrails hold; under 2 support tickets per 100 advisors'],
  ['3 · GA', 'All firms, with a firm-level admin toggle', 'Ongoing monitoring']
])}
<p><strong>Kill switch:</strong> one flag turns off the AI narrative across the platform and falls back to the data-only summary.</p>
<p><strong>Measuring impact:</strong> Stage 2 firms get the feature weeks before the rest, so you compare the two groups over the same weeks. Illustrative result: prep time fell <strong>50 → 19 min</strong> at enabled firms and <strong>50 → 46 min</strong> at not-yet-enabled firms, a seasonal effect of about 4 minutes. The effect you can attribute to the feature is about <strong>(50−19) − (50−46) = 27 minutes</strong>, not the 31 a naive before/after comparison would claim.</p>`
  },

  ],
  tryit: {
    prompt: '<p>“Failed-SIP alerts” are ready to roll out behind a flag. Write a <strong>launch checklist</strong>, the rollout stages, and your <strong>success and guardrail metrics</strong>.</p>',
    placeholder: 'Checklist:\n- \nStages:\nSuccess metrics:\nGuardrails:',
    model: `<p><strong>Checklist:</strong> a per-firm flag plus a global kill switch; monitoring on the RTA feed and its delays; de-duplication so one failure doesn’t send three alerts; compliance review of the alert text; CS training and an FAQ; a help article; an email to partner admins; a metrics dashboard; on-call coverage; a rollback plan.</p>
<p><strong>Stages:</strong> internal (1 week) → 3 pilot firms (2 weeks) → 30% of firms → GA, each with exit criteria.</p>
<p><strong>Success:</strong> share of failed SIPs acted on within 48 hours (target 80%); median time to action.</p>
<p><strong>Guardrails:</strong> false-positive alerts under 2%; notification opt-out rate; support tickets per 100 advisors; RTA feed latency.</p>`
  },
  quiz: [
    { q: 'What’s the difference between deploying and releasing?', o: [
      ['There’s no difference.', false, 'Treating them as one is what makes launches risky.'],
      ['Deploying puts code into production. Releasing makes it available to users. Flags let you do them separately.', true, 'Separating the two lets you ship continuously and expose features gradually.'],
      ['Releasing happens before deploying.', false, 'You can’t release code that isn’t deployed.'],
      ['Deploying is only for mobile apps.', false, 'Every kind of software is deployed.']

    { q: 'What is a guardrail metric?', o: [

      ['Compare against firms not yet enabled over the same period, using a holdout or a staggered rollout.', true, 'A comparison group removes effects that hit everyone, like seasonality.'],
      ['Ask the sales team.', false, 'That’s anecdote, not measurement.'],

    { q: 'Why roll B2B features out firm by firm instead of to a random 10% of advisors?', o: [

      ['It’s cheaper to code.', false, 'Cost isn’t the main reason.'],
      ['There’s no real reason.', false, 'There are strong operational reasons.']

  ]
});

      const raw = window.localStorage.getItem(KEY);
      if (raw) mem = JSON.parse(raw) || {};
      window.localStorage.setItem(KEY + '.probe', '1');
      window.localStorage.removeItem(KEY + '.probe');
      available = true;
    } catch (e) { available = false; }
    return {
      available,
      get(k, d) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : d; },
      set(k, v) {
        mem[k] = v;
        try { window.localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* storage unavailable: keep in memory */ }
      },
      reset() {
        mem = {};
        try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      }
    };
  })();

  const $ = (s, r = document) => r.querySelector(s);

  /* ---------- Lesson rendering ---------- */
  function classifyHTML(l) {
    const c = l.tryit.classify;
    const st = S.cls[l.id] || { picks: {}, checked: false };
    const rows = c.items.map((it, i) => {
      const pick = st.picks[i];
      const right = st.checked && pick === it[1];
      const cls = st.checked && pick !== undefined ? (right ? ' ok' : ' no') : '';
      return `<div class="cls-row${cls}">
        <p>${it[0]}</p>
        <div class="seg" role="group" aria-label="Choose a category">
          ${c.buckets.map((b, bi) => `<button type="button" data-action="cls-pick" data-l="${l.id}" data-i="${i}" data-b="${bi}" aria-pressed="${pick === bi}">${b}</button>`).join('')}
        </div>
        ${st.checked && pick !== undefined ? `<p class="cls-why"><b>${right ? 'Right' : 'Answer: ' + esc(c.buckets[it[1]])}</b>${it[2]}</p>` : ''}
      </div>`;
    }).join('');
    const answered = Object.keys(st.picks).length;
    const correct = c.items.filter((it, i) => st.picks[i] === it[1]).length;
    return `<div class="cls" id="cls-${l.id}">${rows}
      <div class="btnrow">
        <button type="button" class="btn btn-sm btn-primary" data-action="cls-check" data-l="${l.id}"${answered ? '' : ' disabled'}>Check my answers</button>
        <button type="button" class="btn btn-sm btn-ghost" data-action="cls-reset" data-l="${l.id}">Clear</button>
        ${st.checked ? `<span class="cls-score">${correct}/${c.items.length} right${answered < c.items.length ? ` · ${c.items.length - answered} unanswered` : ''}</span>` : `<span class="cls-score">${answered}/${c.items.length} chosen</span>`}
      </div></div>`;
  }

  function quizHTML(l) {
    const ans = S.quiz[l.id] || {};
    const n = l.quiz.length;
    const qs = l.quiz.map((q, qi) => {
      const chosen = ans[qi];
      const answered = chosen !== undefined;
      const opts = q.o.map((o, oi) => {
        let cls = 'opt';
        let flag = '';
        if (answered) {
          if (o[1]) { cls += ' is-correct'; flag = oi === chosen ? 'Your answer · correct' : 'Correct answer'; }
          else if (oi === chosen) { cls += ' is-wrong'; flag = 'Your answer'; }
        }
        return `<li>
          <button type="button" class="${cls}" data-action="answer" data-l="${l.id}" data-q="${qi}" data-o="${oi}"${answered ? ' aria-disabled="true"' : ''}>
            <span class="opt-key" aria-hidden="true">${'ABCD'[oi]}</span><span class="opt-text">${o[0]}</span><span class="opt-flag">${flag}</span>
          </button>
          ${answered ? `<p class="why ${o[1] ? 'good' : 'bad'}"><b>${o[1] ? 'Why it’s right' : 'Why not'}</b>${o[2]}</p>` : ''}
        </li>`;
      }).join('');
      return `<div class="q${answered ? ' answered' : ''}">
        <p class="q-n">Question ${qi + 1} of ${n}</p>
        <p class="q-text">${q.q}</p>
        <ol class="opts" type="A">${opts}</ol>
      </div>`;
    }).join('');
    const answeredCount = Object.keys(ans).length;
    const correct = l.quiz.filter((q, qi) => ans[qi] !== undefined && q.o[ans[qi]][1]).length;
    const pass = Math.max(1, n - 1);
    let sum;
    if (answeredCount < n) sum = `<p><b>${answeredCount}/${n}</b> answered. Pick an option to see why each choice is right or wrong.</p>`;
    else if (correct >= pass) sum = `<p><b>${correct}/${n}</b> correct. Passed: lesson marked complete.</p>`;
    else sum = `<p><b>${correct}/${n}</b> correct. Re-read the explanations above, then retry (pass mark ${pass}/${n}).</p>`;
    return `<div class="quiz" id="quiz-${l.id}">${qs}
      <div class="quiz-sum"><div aria-live="polite">${sum}</div>${answeredCount ? `<button type="button" class="btn btn-sm" data-action="quiz-retry" data-l="${l.id}">Retry quiz</button>` : ''}</div>
    </div>`;
  }

  /* ---------- Glossary ---------- */
  const G = { q: '', f: 'all' };
  function glossaryList() {
    const q = G.q.trim().toLowerCase();
    const items = GLOSSARY.filter(g => {
      if (G.f === 'pm' && g.track !== 'pm') return false;
      if (G.f === 'scrum' && g.track !== 'scrum') return false;
      if (G.f === 'sg' && !g.sg) return false;
      if (!q) return true;
      return (g.term + ' ' + (g.aka || '') + ' ' + g.def).toLowerCase().includes(q);
    }).sort((a, b) => a.term.localeCompare(b.term));
    let html = '';
    let letter = '';
    items.forEach(g => {
      const L = /[a-z]/i.test(g.term[0]) ? g.term[0].toUpperCase() : '#';
      if (L !== letter) { letter = L; html += `<h2 class="gl-letter">${L}</h2>`; }
      const lesson = g.lesson && LMAP[g.lesson];
      html += `<div class="gl-item">
        <div class="gl-term"><h3>${esc(g.term)}</h3>
          <span class="badge ${g.track === 'pm' ? 'pm' : ''}">${g.track === 'pm' ? 'PM' : 'Scrum'}</span>
          ${g.sg ? '<span class="badge sg">Scrum Guide term</span>' : ''}${g.np ? '<span class="badge np">Not in Scrum Guide</span>' : ''}
        </div>
        <p class="gl-def">${g.def}${lesson ? ` <a class="gl-link" href="#${lesson.id}">Lesson: ${lesson.short || lesson.title} →</a>` : ''}</p>
      </div>`;
    });
    $('#gl-count').textContent = `${items.length} of ${GLOSSARY.length} terms`;
    $('#gl-list').innerHTML = html || `<p class="empty">No terms match “${esc(G.q)}”. Try a shorter word, or clear the filter.</p>`;
  }
  function glossaryPage() {
    const chip = (v, label) => `<button type="button" class="chip" data-action="gl-filter" data-v="${v}" aria-pressed="${G.f === v}">${label}</button>`;
    return `<div class="page">

      <h1 tabindex="-1" id="page-title">Glossary</h1>

      <div class="searchbar">

  /* ---------- Flashcards ---------- */
  const F = { f: store.get('fcFilter', 'all'), order: null, i: 0, flipped: false };
  function fcDeck() {
    let cards = GLOSSARY.filter(g => g.card);
    if (F.f === 'pm') cards = cards.filter(c => c.track === 'pm');
    if (F.f === 'scrum') cards = cards.filter(c => c.track === 'scrum');
    if (F.f === 'learning') cards = cards.filter(c => !S.known.has(c.term));
    if (F.order) {
      const pos = new Map(F.order.map((t, i) => [t, i]));
      cards = cards.slice().sort((a, b) => (pos.has(a.term) ? pos.get(a.term) : 1e6) - (pos.has(b.term) ? pos.get(b.term) : 1e6));
    }
    return cards;
  }
  function flashcardsInner() {
    const deck = fcDeck();
    const all = GLOSSARY.filter(g => g.card);
    const knownCount = all.filter(c => S.known.has(c.term)).length;
    if (!deck.length) {
      return `<div class="empty"><p>${F.f === 'learning' ? 'You know every card in the deck. Nice work.' : 'No cards in this deck.'}</p><button type="button" class="btn" data-action="fc-filter" data-v="all">Show all cards</button></div>`;
    }
    if (F.i >= deck.length) F.i = 0;
    const c = deck[F.i];
    const isKnown = S.known.has(c.term);
    return `<div class="fc-stage">
        <button type="button" class="fc${F.flipped ? ' flipped' : ''}" id="fc-card" data-action="fc-flip" aria-label="${F.flipped ? 'Definition shown. Press to show the term' : 'Term shown. Press to reveal the definition'}">
          <span class="fc-inner">
            <span class="fc-face fc-front" aria-hidden="${F.flipped}">
              ${isKnown ? '<span class="badge sg fc-known">Known</span>' : ''}
              <span class="badge ${c.track === 'pm' ? 'pm' : ''}">${c.track === 'pm' ? 'PM' : 'Scrum'}${c.sg ? ' · Scrum Guide' : ''}${c.np ? ' · not in Guide' : ''}</span>
              <span class="fc-term">${esc(c.term)}</span>
              <span class="fc-hint">Tap or press space to flip</span>
            </span>
            <span class="fc-face fc-back" aria-hidden="${!F.flipped}">
              <span class="fc-hint">${esc(c.term)}</span>
              <span class="fc-def">${c.def}</span>
            </span>
          </span>
        </button>
      </div>
      <div class="fc-bar">
        <span class="fc-pos">Card ${F.i + 1} / ${deck.length} · ${knownCount}/${all.length} known</span>
        <div class="btnrow">
          <button type="button" class="btn btn-sm" data-action="fc-prev" aria-label="Previous card">←</button>
          <button type="button" class="btn btn-sm" data-action="fc-again">Still learning</button>
          <button type="button" class="btn btn-sm btn-primary" data-action="fc-know">${isKnown ? 'Known ✓ · next' : 'I know this'}</button>
          <button type="button" class="btn btn-sm" data-action="fc-next" aria-label="Next card">→</button>
        </div>
      </div>`;
  }
  function flashcardsPage() {
    const chip = (v, label) => `<button type="button" class="chip" data-action="fc-filter" data-v="${v}" aria-pressed="${F.f === v}">${label}</button>`;
    return `<div class="page">
      <p class="eyebrow"><span>Practice</span></p>
      <h1 tabindex="-1" id="page-title">Flashcards</h1>
      <p class="lead">Say the definition out loud, then flip to check. Cards you mark “I know this” drop out of the “Still learning” deck.</p>
      <div class="fc-wrap">
        <div class="chips">${chip('all', 'All cards')}${chip('pm', 'PM')}${chip('scrum', 'Scrum')}${chip('learning', 'Still learning')}
          <button type="button" class="chip" data-action="fc-shuffle">Shuffle</button>
          <button type="button" class="chip" data-action="fc-unknow">Reset known</button></div>
        <div id="fc-body">${flashcardsInner()}</div>
        <p class="fc-hint" style="text-align:center">Keyboard: <span class="kbd">Space</span> flip · <span class="kbd">←</span> <span class="kbd">→</span> move · <span class="kbd">K</span> know it · <span class="kbd">L</span> still learning</p>
      </div>
    </div>`;
  }
  function fcRefresh() { const b = $('#fc-body'); if (b) b.innerHTML = flashcardsInner(); renderNav('flashcards'); }

  /* ---------- Sprint simulator ---------- */
  const METERS = [['goal', 'Sprint Goal'], ['trust', 'Stakeholder trust'], ['team', 'Team health']];
  const clamp = v => Math.max(0, Math.min(100, v));
  function simNew() { return { i: 0, picks: [], m: { goal: 60, trust: 60, team: 60 }, last: null }; }
  function simState() { if (!S.sim || !Array.isArray(S.sim.picks)) S.sim = simNew(); return S.sim; }
  function simMax() { return SIM.steps.reduce((a, s) => a + Math.max(...s.options.map(o => o.s)), 0); }
  function simScore(st) { return st.picks.reduce((a, p, i) => a + (SIM.steps[i] ? SIM.steps[i].options[p].s : 0), 0); }
  function gaugesHTML(st) {
    return `<div class="gauges">${METERS.map(([k, label]) => {
      const v = st.m[k];
      const d = st.last && st.last[k] ? st.last[k] : 0;
      const cls = v < 40 ? 'lo' : v < 65 ? 'mid' : '';
      return `<div class="gauge"><div class="gauge-top"><span>${label}</span><b>${v}${d ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</span>` : ''}</b></div>
        <div class="meter" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><i class="${cls}" style="width:${v}%"></i></div></div>`;
    }).join('')}</div>`;
  }
  function timelineHTML(day) {
    return `<div class="timeline" aria-label="Sprint day ${day} of 10">${Array.from({ length: 10 }, (_, i) => {
      const d = i + 1;
      return `<div class="tl-day ${d < day ? 'past' : d === day ? 'now' : ''}"><i></i><span>D${d}</span></div>`;
    }).join('')}</div>`;
  }
  function simInner() {
    const st = simState();
    const steps = SIM.steps;
    if (!steps.length) return '<p class="empty">Simulator content is loading.</p>';
    if (st.i >= steps.length) {
      const score = simScore(st);
      const pct = Math.round(score / simMax() * 100);
      const rating = SIM.ratings.find(r => pct >= r.min);
      return `${timelineHTML(11)}${gaugesHTML(st)}
        <div class="scene">
          <div class="scene-tag"><span class="badge sg">Sprint complete</span></div>
          <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><span class="score-big">${pct}%</span><div><h2>${rating.title}</h2><p class="lead" style="margin-top:6px;font-size:1rem">${rating.text}</p></div></div>
          <h3 style="font-size:1.05rem;margin-top:6px">Your decisions</h3>
          <ol class="recap">${steps.map((s, i) => {
            const o = s.options[st.picks[i]];
            const best = s.options.reduce((a, b) => (b.s > a.s ? b : a));
            return `<li><div class="r-top"><span>Day ${s.day} · ${s.phase}</span><span>${o.s}/${best.s}</span></div>
              <b>${s.title}</b><span>You chose: ${o.t}</span>${o !== best ? `<span style="color:var(--good)">Strongest move: ${best.t}</span>` : ''}
              ${s.lesson && LMAP[s.lesson] ? `<a href="#${s.lesson}" style="font-size:.82rem">Review: ${LMAP[s.lesson].short || LMAP[s.lesson].title} →</a>` : ''}</li>`;
          }).join('')}</ol>
          <div class="btnrow"><button type="button" class="btn btn-primary" data-action="sim-restart">Run the Sprint again</button><a class="btn" href="#cheatsheet">Open the cheat sheet</a></div>
        </div>`;
    }
    const s = steps[st.i];
    const pick = st.picks[st.i];
    const answered = pick !== undefined;
    const o = answered ? s.options[pick] : null;
    const max = Math.max(...s.options.map(x => x.s));
    const lvl = o ? (o.s >= max ? 's-hi' : o.s >= max / 2 ? 's-mid' : 's-lo') : '';
    return `${timelineHTML(s.day)}${gaugesHTML(st)}
      <div class="scene" id="scene">
        <div class="scene-tag"><span class="badge">Decision ${st.i + 1} of ${steps.length}</span><span class="badge sg">Day ${s.day} · ${s.phase}</span></div>
        <h2 tabindex="-1" id="scene-title">${s.title}</h2>
        <div class="prose">${s.scene}</div>
        <ol class="choices${answered ? ' locked' : ''}">${s.options.map((c, ci) => `<li><button type="button" class="choice${pick === ci ? ' picked' : ''}" data-action="sim-pick" data-o="${ci}"${answered ? ' aria-disabled="true"' : ''}><span class="opt-key">${'ABCD'[ci]}</span><span>${c.t}</span></button></li>`).join('')}</ol>
        ${o ? `<div class="fb ${lvl}" id="sim-fb"><div class="fb-h"><span>${o.s >= max ? 'Strong move' : o.s >= max / 2 ? 'Partly right' : 'Risky move'}</span><span>+${o.s} of ${max} pts</span></div><p>${o.fb}</p>${o.ref ? `<p class="ref">${ICON_BOOK.replace('<svg', '<svg width="13" height="13" style="vertical-align:-2px;margin-right:4px"')}${o.ref}</p>` : ''}</div>
          <div class="btnrow"><button type="button" class="btn btn-primary" data-action="sim-next">${st.i + 1 < steps.length ? 'Continue the Sprint →' : 'See how the Sprint went →'}</button></div>` : ''}
      </div>`;
  }
  function simulatorPage() {
    return `<div class="page">
      <p class="eyebrow"><span>Practice</span><span class="dot"></span><span>${SIM.steps.length} decisions</span>${S.simBest != null ? `<span class="dot"></span><span>Best ${S.simBest}%</span>` : ''}</p>
      <h1 tabindex="-1" id="page-title">${SIM.title || 'Sprint simulator'}</h1>
      <div class="prose" style="margin-top:14px">${SIM.intro || ''}</div>
      <div class="sim" id="sim-body">${simInner()}</div>
      <p class="btnrow" style="margin-top:18px"><button type="button" class="linkbtn" data-action="sim-restart">Restart the simulator</button></p>
    </div>`;
  }
  function simRefresh(focusSel) {
    const b = $('#sim-body');
    if (b) b.innerHTML = simInner();
    if (focusSel) { const el = $(focusSel); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }
  }

  /* ---------- Cheat sheet ---------- */
  function cheatPage() {
    return `<div class="page wide">
      <div class="cheat-head">
        <p class="eyebrow"><span>Reference</span><span class="dot"></span><span>Scrum content per the Scrum Guide (Nov 2020)</span></p>
        <h1 tabindex="-1" id="page-title">Cheat sheet</h1>
        <p class="lead">The whole course on one page.${inFrame ? ' To print it, open the file directly in your browser and press Ctrl/Cmd + P.' : ' Press Ctrl/Cmd + P or use the button to print it on one A4 sheet.'}</p>
        ${inFrame ? '' : '<div class="btnrow no-print" style="margin-top:16px"><button type="button" class="btn btn-primary" data-action="print">Print cheat sheet</button></div>'}
      </div>
      <div class="cheat">${CHEAT}</div>
    </div>`;
  }

  /* ---------- Router ---------- */
  function route() {
    const h = (location.hash || '').replace(/^#\/?/, '') || 'home';
    return h;
  }
  function render() {
    const r = route();
    const main = $('#main');
    let html;
    if (LMAP[r]) { html = lessonPage(LMAP[r]); S.last = r; persist('last'); }
    else if (r === 'glossary') html = glossaryPage();
    else if (r === 'flashcards') html = flashcardsPage();
    else if (r === 'simulator') html = simulatorPage();
    else if (r === 'cheatsheet') html = cheatPage();
    else html = homePage();
    main.innerHTML = html;
    if (r === 'glossary') glossaryList();
    $$('[data-widget]', main).forEach(el => { const w = WIDGETS[el.dataset.widget]; if (w && w.mount) w.mount(el, store); });
    renderNav(LMAP[r] || ['glossary', 'flashcards', 'simulator', 'cheatsheet'].includes(r) ? r : 'home');
    const t = LMAP[r] ? (LMAP[r].title + ' · ') : r !== 'home' && ['glossary', 'flashcards', 'simulator', 'cheatsheet'].includes(r) ? ({ glossary: 'Glossary', flashcards: 'Flashcards', simulator: 'Sprint simulator', cheatsheet: 'Cheat sheet' }[r] + ' · ') : '';
    document.title = t + 'PM & Scrum Fundamentals';
  }
  function navigate() {
    closeMenu();
    render();
    window.scrollTo(0, 0);
    const h = $('#page-title');
    if (h) h.focus({ preventScroll: true });
  }

  /* ---------- Menu (mobile drawer) ---------- */
  function openMenu() { $('#sidebar').classList.add('open'); $('.scrim').classList.add('open'); $('[data-action="menu"]').setAttribute('aria-expanded', 'true'); const a = $('#sidebar a[aria-current="page"]') || $('#sidebar a'); if (a) a.focus(); }
  function closeMenu() { const sb = $('#sidebar'); if (!sb.classList.contains('open')) return; sb.classList.remove('open'); $('.scrim').classList.remove('open'); $('[data-action="menu"]').setAttribute('aria-expanded', 'false'); }

  /* ---------- Actions ---------- */
  function setComplete(id, on) {
    if (on) S.completed.add(id); else S.completed.delete(id);
    persist('completed');
  }
  let resetArmed = null;
  const actions = {
    menu: () => openMenu(),
    'close-menu': () => closeMenu(),
    theme: el => { S.theme = el.dataset.v; persist('theme'); applyTheme(); renderNav(route()); },
    reset: el => {
      if (!resetArmed) {
        el.textContent = 'Click again to erase all progress';
        el.classList.add('armed');
        resetArmed = setTimeout(() => { resetArmed = null; el.textContent = 'Reset all progress'; el.classList.remove('armed'); }, 4000);
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      const theme = S.theme;
      store.reset();
      S.completed = new Set(); S.quiz = {}; S.drafts = {}; S.revealed = {}; S.cls = {}; S.known = new Set(); S.sim = null; S.simBest = null; S.last = null;
      S.theme = theme; persist('theme');
      F.order = null; F.i = 0; F.flipped = false;
      render();
      live('All progress erased.');
    },
    answer: el => {
      const { l, q, o } = el.dataset;
      const lesson = LMAP[l];
      S.quiz[l] = S.quiz[l] || {};
      if (S.quiz[l][q] !== undefined) return;
      S.quiz[l][q] = +o;
      persist('quiz');
      const ok = lesson.quiz[q].o[o][1];
      const ans = S.quiz[l];
      const n = lesson.quiz.length;
      if (Object.keys(ans).length === n) {
        const correct = lesson.quiz.filter((qq, qi) => qq.o[ans[qi]][1]).length;
        if (correct >= Math.max(1, n - 1) && !S.completed.has(l)) { setComplete(l, true); }
      }
      const box = $('#quiz-' + l);
      box.outerHTML = quizHTML(lesson);
      const btn = $(`#quiz-${l} [data-q="${q}"][data-o="${o}"]`);
      if (btn) btn.focus({ preventScroll: true });
      syncLessonChrome(lesson);
      live(ok ? 'Correct.' : 'Not quite. The explanation is shown under each option.');
    },
    'quiz-retry': el => {
      const l = el.dataset.l;
      delete S.quiz[l]; persist('quiz');
      const box = $('#quiz-' + l);
      box.outerHTML = quizHTML(LMAP[l]);
      const first = $(`#quiz-${l} .opt`);
      if (first) first.focus();
    },
    complete: el => {
      const l = el.dataset.l;
      setComplete(l, !S.completed.has(l));
      syncLessonChrome(LMAP[l]);
      live(S.completed.has(l) ? 'Lesson marked complete.' : 'Lesson marked not complete.');
    },
    reveal: el => {
      const l = el.dataset.l;
      S.revealed[l] = !S.revealed[l]; persist('revealed');
      const m = $('#model-' + l);
      m.hidden = !S.revealed[l];
      el.textContent = S.revealed[l] ? 'Hide model answer' : 'Reveal model answer';
      el.setAttribute('aria-expanded', String(!!S.revealed[l]));
    },
    'cls-pick': el => {
      const { l, i, b } = el.dataset;
      const st = S.cls[l] || { picks: {}, checked: false };
      st.picks[i] = +b; st.checked = false;
      S.cls[l] = st; persist('cls');
      $('#cls-' + l).outerHTML = classifyHTML(LMAP[l]);
      const again = $(`#cls-${l} [data-i="${i}"][data-b="${b}"]`); if (again) again.focus({ preventScroll: true });
    },
    'cls-check': el => {
      const l = el.dataset.l;
      const st = S.cls[l] || { picks: {}, checked: false };
      st.checked = true; S.cls[l] = st; persist('cls');
      $('#cls-' + l).outerHTML = classifyHTML(LMAP[l]);
      const c = LMAP[l].tryit.classify;
      const correct = c.items.filter((it, i) => st.picks[i] === it[1]).length;
      live(`${correct} of ${c.items.length} right.`);
    },
    'cls-reset': el => {
      const l = el.dataset.l;
      delete S.cls[l]; persist('cls');
      $('#cls-' + l).outerHTML = classifyHTML(LMAP[l]);
    },
    'gl-filter': el => { G.f = el.dataset.v; $$('[data-action="gl-filter"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === G.f))); glossaryList(); },
    'fc-flip': () => {
      const c = $('#fc-card'); if (!c) return;
      F.flipped = !F.flipped;
      c.classList.toggle('flipped', F.flipped);
      c.setAttribute('aria-label', F.flipped ? 'Definition shown. Press to show the term' : 'Term shown. Press to reveal the definition');
      $('.fc-front', c).setAttribute('aria-hidden', String(F.flipped));
      $('.fc-back', c).setAttribute('aria-hidden', String(!F.flipped));
      live(F.flipped ? $('.fc-def', c).textContent : $('.fc-term', c).textContent);
    },
    'fc-next': () => { const n = fcDeck().length; if (!n) return; F.i = (F.i + 1) % n; F.flipped = false; fcRefresh(); },
    'fc-prev': () => { const n = fcDeck().length; if (!n) return; F.i = (F.i - 1 + n) % n; F.flipped = false; fcRefresh(); },
    'fc-know': () => {
      const deck = fcDeck(); if (!deck.length) return;
      S.known.add(deck[F.i].term); persist('known');
      F.flipped = false;
      if (F.f !== 'learning') F.i = (F.i + 1) % deck.length;
      fcRefresh(); live('Marked as known.');
    },
    'fc-again': () => {
      const deck = fcDeck(); if (!deck.length) return;
      S.known.delete(deck[F.i].term); persist('known');
      F.flipped = false; F.i = (F.i + 1) % deck.length;
      fcRefresh();
    },
    'fc-filter': el => { F.f = el.dataset.v; store.set('fcFilter', F.f); F.i = 0; F.flipped = false; $$('[data-action="fc-filter"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === F.f))); fcRefresh(); },
    'fc-shuffle': () => {
      const terms = GLOSSARY.filter(g => g.card).map(g => g.term);
      for (let i = terms.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [terms[i], terms[j]] = [terms[j], terms[i]]; }
      F.order = terms; F.i = 0; F.flipped = false; fcRefresh(); live('Deck shuffled.');
    },
    'fc-unknow': () => { S.known = new Set(); persist('known'); F.i = 0; F.flipped = false; fcRefresh(); live('All cards reset to still learning.'); },
    'sim-pick': el => {
      const st = simState();
      if (st.picks[st.i] !== undefined) return;
      const o = SIM.steps[st.i].options[+el.dataset.o];
      st.picks[st.i] = +el.dataset.o;
      const fx = o.fx || {};
      st.last = {};
      METERS.forEach(([k]) => { const before = st.m[k]; st.m[k] = clamp(before + (fx[k] || 0)); st.last[k] = st.m[k] - before; });
      persist('sim');
      simRefresh('#sim-fb');
    },
    'sim-next': () => {
      const st = simState();
      st.i += 1; st.last = null;
      if (st.i >= SIM.steps.length) {
        const pct = Math.round(simScore(st) / simMax() * 100);
        if (S.simBest == null || pct > S.simBest) { S.simBest = pct; persist('simBest'); }
        renderNav('simulator');
      }
      persist('sim');
      simRefresh(st.i < SIM.steps.length ? '#scene-title' : '.scene');
    },
    'sim-restart': () => { S.sim = simNew(); persist('sim'); simRefresh('#scene-title'); },
    print: () => { try { window.print(); } catch (e) { /* print unavailable */ } }
  };
  function syncLessonChrome(lesson) {
    const done = S.completed.has(lesson.id);
    const b = $('.complete-btn');
    if (b) { b.setAttribute('aria-pressed', String(done)); b.textContent = done ? '✓ Completed · click to undo' : 'Mark lesson complete'; }
    renderNav(lesson.id);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.getAttribute('aria-disabled') === 'true' || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el); }
  });
  let draftTimer = null;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'gl-q') { G.q = t.value; glossaryList(); return; }
    if (t.classList.contains('draft')) {
      const l = t.dataset.l;
      clearTimeout(draftTimer);
      draftTimer = setTimeout(() => {
        S.drafts[l] = t.value; persist('drafts');
        const m = $('#draft-meta-' + l); if (m) m.textContent = store.available ? 'Draft saved' : 'Draft kept for this session (storage is blocked)';
      }, 350);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMenu();
    if (route() !== 'flashcards') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    const onButton = tag === 'button' && e.target.id !== 'fc-card';
    if (e.key === ' ' && !onButton) { e.preventDefault(); actions['fc-flip'](); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); actions['fc-next'](); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); actions['fc-prev'](); }
    else if (e.key.toLowerCase() === 'k') actions['fc-know']();
    else if (e.key.toLowerCase() === 'l') actions['fc-again']();
  });
  window.addEventListener('hashchange', navigate);
  window.addEventListener('resize', () => { if (window.innerWidth > 900) closeMenu(); });

  render();
})();
</script>
</body>
</html>
