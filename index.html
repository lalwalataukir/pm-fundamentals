<script>
(function () {
  'use strict';

  /* ---------- Safe storage: every read/write is wrapped; falls back to memory ---------- */
  const store = (() => {
    const KEY = 'pm-scrum-course.v1';
    let mem = {};
    let available = false;
    try {
      const raw = window.localStorage.getItem(KEY);
      if (raw) mem = JSON.parse(raw) || {};
      window.localStorage.setItem(KEY + '.probe', '1');
      window.localStorage.removeItem(KEY + '.probe');
      available = true;
    } catch (e) { available = false; }
    return {
      available,
      get(k, d) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : d; },
      set(k, v) {
        mem[k] = v;
        try { window.localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* storage unavailable: keep in memory */ }
      },
      reset() {
        mem = {};
        try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      }
    };
  })();

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const live = msg => { const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); };
  const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  const TRACKS = {
    pm: { name: 'PM Fundamentals', label: 'Track 1' },
    scrum: { name: 'Scrum Fundamentals', label: 'Track 2' }
  };
  const byTrack = t => LESSONS.filter(l => l.track === t).sort((a, b) => a.n - b.n);
  const ORDER = [...byTrack('pm'), ...byTrack('scrum')];
  const LMAP = Object.fromEntries(ORDER.map(l => [l.id, l]));

  /* ---------- State ---------- */
  const S = {
    completed: new Set(store.get('completed', [])),
    quiz: store.get('quiz', {}),
    drafts: store.get('drafts', {}),
    revealed: store.get('revealed', {}),
    cls: store.get('cls', {}),
    known: new Set(store.get('known', [])),
    sim: store.get('sim', null),
    simBest: store.get('simBest', null),
    theme: store.get('theme', 'system'),
    last: store.get('last', null)
  };
  const persist = key => {
    const v = S[key];
    store.set(key, v instanceof Set ? [...v] : v);
  };

  /* ---------- Theme ---------- */
  function applyTheme() {
    const root = document.documentElement;
    if (S.theme === 'light' || S.theme === 'dark') root.setAttribute('data-theme', S.theme);
    else root.removeAttribute('data-theme');
  }
  applyTheme();

  /* ---------- Icons ---------- */
  const IC = {
    sim: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/><path d="M12 8v4l2.5 2.5"/></svg>',
    cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>',
    gloss: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 5h11M4 10h16M4 15h9M4 20h13"/><circle cx="18.5" cy="16.5" r="2.5"/></svg>',
    sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 15h7M9 19h4" stroke-linecap="round"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>'
  };
  const MARK = '<svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 22.5c2.5-6 5-9 8-9s4.5 3 8-5" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="25" cy="8.5" r="2.4" fill="var(--gold)"/></svg>';

  /* ---------- Sidebar ---------- */
  function trackStats(t) {
    const ls = byTrack(t);
    const done = ls.filter(l => S.completed.has(l.id)).length;
    return { done, total: ls.length };
  }
  function overallPct() {
    const total = ORDER.length || 1;
    const done = ORDER.filter(l => S.completed.has(l.id)).length;
    return Math.round(done / total * 100);
  }
  function renderNav(route) {
    const pct = overallPct();
    const cards = GLOSSARY.filter(g => g.card);
    const knownCount = cards.filter(c => S.known.has(c.term)).length;
    const navTrack = t => {
      const st = trackStats(t);
      return `<div class="nav-group">
        <div class="nav-head"><h2>${TRACKS[t].label} · ${TRACKS[t].name}</h2><span>${st.done}/${st.total}</span></div>
        <div class="meter" role="progressbar" aria-label="${TRACKS[t].name} progress" aria-valuemin="0" aria-valuemax="${st.total}" aria-valuenow="${st.done}"><i style="width:${st.total ? st.done / st.total * 100 : 0}%"></i></div>
        ${byTrack(t).map(l => `<a class="nav-link${S.completed.has(l.id) ? ' done' : ''}" href="#${l.id}"${route === l.id ? ' aria-current="page"' : ''}>
          <span class="nav-num" aria-hidden="true">${S.completed.has(l.id) ? '✓' : l.n}</span>
          <span>${l.short || l.title}${S.completed.has(l.id) ? '<span class="sr-only"> (completed)</span>' : ''}</span></a>`).join('')}
      </div>`;
    };
    const tool = (id, ico, label, meta) => `<a class="nav-link" href="#${id}"${route === id ? ' aria-current="page"' : ''}><span class="tool-ico">${ico}</span><span>${label}${meta ? `<span class="nav-meta">${meta}</span>` : ''}</span></a>`;
    $('#sidebar').innerHTML = `
      <a class="brand" href="#home">${MARK}<span class="brand-name">PM &amp; Scrum Fundamentals<span class="brand-sub">Field course for a new APM</span></span></a>
      <div class="overall">
        <div class="overall-row"><span>Course progress</span><b>${pct}%</b></div>
        <div class="meter" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      </div>
      <div class="nav-group">${tool('home', IC.home, 'Start here')}</div>
      ${navTrack('pm')}
      ${navTrack('scrum')}
      <div class="nav-group">
        <div class="nav-head"><h2>Practice &amp; reference</h2></div>
        ${tool('simulator', IC.sim, 'Sprint simulator', S.simBest != null ? `Best score ${S.simBest}%` : '8 decisions · ~10 min')}
        ${tool('flashcards', IC.cards, 'Flashcards', `${knownCount}/${cards.length} known`)}
        ${tool('glossary', IC.gloss, 'Glossary', `${GLOSSARY.length} terms`)}
        ${tool('cheatsheet', IC.sheet, 'Cheat sheet', 'One printable page')}
      </div>
      <div class="side-foot">
        <div class="foot-row"><span class="foot-label">Theme</span>
          <div class="seg" role="group" aria-label="Theme">
            ${['system', 'light', 'dark'].map(v => `<button type="button" data-action="theme" data-v="${v}" aria-pressed="${S.theme === v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}
          </div>
        </div>
        <div class="foot-row"><button type="button" class="linkbtn" data-action="reset">Reset all progress</button></div>
        ${store.available ? '' : '<p class="storage-note">This browser is blocking storage, so progress lasts only until you close the tab.</p>'}
      </div>`;
    $('#top-pct').textContent = pct + '% complete';
  }

  /* ---------- Lesson rendering ---------- */
  function classifyHTML(l) {
    const c = l.tryit.classify;
    const st = S.cls[l.id] || { picks: {}, checked: false };
    const rows = c.items.map((it, i) => {
      const pick = st.picks[i];
      const right = st.checked && pick === it[1];
      const cls = st.checked && pick !== undefined ? (right ? ' ok' : ' no') : '';
      return `<div class="cls-row${cls}">
        <p>${it[0]}</p>
        <div class="seg" role="group" aria-label="Choose a category">
          ${c.buckets.map((b, bi) => `<button type="button" data-action="cls-pick" data-l="${l.id}" data-i="${i}" data-b="${bi}" aria-pressed="${pick === bi}">${b}</button>`).join('')}
        </div>
        ${st.checked && pick !== undefined ? `<p class="cls-why"><b>${right ? 'Right' : 'Answer: ' + esc(c.buckets[it[1]])}</b>${it[2]}</p>` : ''}
      </div>`;
    }).join('');
    const answered = Object.keys(st.picks).length;
    const correct = c.items.filter((it, i) => st.picks[i] === it[1]).length;
    return `<div class="cls" id="cls-${l.id}">${rows}
      <div class="btnrow">
        <button type="button" class="btn btn-sm btn-primary" data-action="cls-check" data-l="${l.id}"${answered ? '' : ' disabled'}>Check my answers</button>
        <button type="button" class="btn btn-sm btn-ghost" data-action="cls-reset" data-l="${l.id}">Clear</button>
        ${st.checked ? `<span class="cls-score">${correct}/${c.items.length} right${answered < c.items.length ? ` · ${c.items.length - answered} unanswered` : ''}</span>` : `<span class="cls-score">${answered}/${c.items.length} chosen</span>`}
      </div></div>`;
  }

  function quizHTML(l) {
    const ans = S.quiz[l.id] || {};
    const n = l.quiz.length;
    const qs = l.quiz.map((q, qi) => {
      const chosen = ans[qi];
      const answered = chosen !== undefined;
      const opts = q.o.map((o, oi) => {
        let cls = 'opt';
        let flag = '';
        if (answered) {
          if (o[1]) { cls += ' is-correct'; flag = oi === chosen ? 'Your answer · correct' : 'Correct answer'; }
          else if (oi === chosen) { cls += ' is-wrong'; flag = 'Your answer'; }
        }
        return `<li>
          <button type="button" class="${cls}" data-action="answer" data-l="${l.id}" data-q="${qi}" data-o="${oi}"${answered ? ' aria-disabled="true"' : ''}>
            <span class="opt-key" aria-hidden="true">${'ABCD'[oi]}</span><span class="opt-text">${o[0]}</span><span class="opt-flag">${flag}</span>
          </button>
          ${answered ? `<p class="why ${o[1] ? 'good' : 'bad'}"><b>${o[1] ? 'Why it’s right' : 'Why not'}</b>${o[2]}</p>` : ''}
        </li>`;
      }).join('');
      return `<div class="q${answered ? ' answered' : ''}">
        <p class="q-n">Question ${qi + 1} of ${n}</p>
        <p class="q-text">${q.q}</p>
        <ol class="opts" type="A">${opts}</ol>
      </div>`;
    }).join('');
    const answeredCount = Object.keys(ans).length;
    const correct = l.quiz.filter((q, qi) => ans[qi] !== undefined && q.o[ans[qi]][1]).length;
    const pass = Math.max(1, n - 1);
    let sum;
    if (answeredCount < n) sum = `<p><b>${answeredCount}/${n}</b> answered. Pick an option to see why each choice is right or wrong.</p>`;
    else if (correct >= pass) sum = `<p><b>${correct}/${n}</b> correct. Passed: lesson marked complete.</p>`;
    else sum = `<p><b>${correct}/${n}</b> correct. Re-read the explanations above, then retry (pass mark ${pass}/${n}).</p>`;
    return `<div class="quiz" id="quiz-${l.id}">${qs}
      <div class="quiz-sum"><div aria-live="polite">${sum}</div>${answeredCount ? `<button type="button" class="btn btn-sm" data-action="quiz-retry" data-l="${l.id}">Retry quiz</button>` : ''}</div>
    </div>`;
  }

  function tryitHTML(l) {
    const t = l.tryit;
    const draft = S.drafts[l.id] || '';
    const revealed = !!S.revealed[l.id];
    let widget = '';
    if (t.widget && WIDGETS[t.widget]) widget = `<div data-widget="${t.widget}" data-l="${l.id}">${WIDGETS[t.widget].html(store)}</div>`;
    if (t.classify) widget += classifyHTML(l);
    const text = t.noText ? '' : `
      <div>
        <label class="sr-only" for="draft-${l.id}">Your answer</label>
        <textarea class="draft" id="draft-${l.id}" data-l="${l.id}" placeholder="${esc(t.placeholder || 'Write your answer here. It is saved as you type.')}">${esc(draft)}</textarea>
        <div class="draft-meta" id="draft-meta-${l.id}">${draft ? 'Draft saved' : 'Your draft is saved in this browser as you type.'}</div>
      </div>`;
    return `<div class="tryit">
      <div class="prose">${t.prompt}</div>
      ${widget}${text}
      <div class="btnrow"><button type="button" class="btn btn-sm" data-action="reveal" data-l="${l.id}" aria-expanded="${revealed}" aria-controls="model-${l.id}">${revealed ? 'Hide model answer' : 'Reveal model answer'}</button></div>
      <div class="model" id="model-${l.id}"${revealed ? '' : ' hidden'}><p class="callout-h">Model answer</p><div class="prose">${t.model}</div></div>
    </div>`;
  }

  function lessonPage(l) {
    const list = byTrack(l.track);
    const idx = ORDER.indexOf(l);
    const prev = ORDER[idx - 1];
    const next = ORDER[idx + 1];
    const done = S.completed.has(l.id);
    return `<article class="page lesson">
      <p class="eyebrow"><span>${TRACKS[l.track].name}</span><span class="dot"></span><span>Lesson ${l.n} of ${list.length}</span><span class="dot"></span><span>${l.minutes || 10} min</span>${done ? '<span class="dot"></span><span style="color:var(--good)">Completed</span>' : ''}</p>
      <h1 tabindex="-1" id="page-title">${l.title}</h1>
      ${l.sub ? `<p class="lead">${l.sub}</p>` : ''}
      <div class="idea"><p class="section-label">The idea in one line</p><p>${l.idea}</p></div>

      <section class="section" aria-labelledby="s-exp"><h2 class="section-label" id="s-exp">Explanation</h2><div class="prose">${l.body}</div></section>

      <section class="section" aria-labelledby="s-ex"><h2 class="section-label" id="s-ex">Worked example</h2>
        <div class="example"><span class="tag">${l.example.tag || 'B2B wealth-tech · AI platform'}</span><h3>${l.example.title}</h3><div class="prose">${l.example.html}</div></div>
      </section>

      <section class="section" aria-labelledby="s-mis"><h2 class="section-label" id="s-mis">Common mistakes new PMs make</h2>
        <ul class="mistakes">${l.mistakes.map(m => `<li><span>${m}</span></li>`).join('')}</ul>
      </section>

      <section class="section" aria-labelledby="s-try"><h2 class="section-label" id="s-try">Try it</h2>${tryitHTML(l)}</section>

      <section class="section" aria-labelledby="s-q"><h2 class="section-label" id="s-q">Quick check</h2>${quizHTML(l)}</section>

      <footer class="lesson-foot">
        <div class="btnrow">
          <button type="button" class="btn complete-btn" data-action="complete" data-l="${l.id}" aria-pressed="${done}">${done ? '✓ Completed · click to undo' : 'Mark lesson complete'}</button>
        </div>
        <nav class="pager" aria-label="Lesson navigation">
          ${prev ? `<a href="#${prev.id}" class="prev"><small>← Previous</small><span>${prev.title}</span></a>` : '<span></span>'}
          ${next ? `<a href="#${next.id}" class="next"><small>Next →</small><span>${next.title}</span></a>` : `<a href="#simulator" class="next"><small>Next →</small><span>Sprint simulator</span></a>`}
        </nav>
      </footer>
    </article>`;
  }

  /* ---------- Home ---------- */
  function homePage() {
    const resume = S.last && LMAP[S.last] ? LMAP[S.last] : ORDER.find(l => !S.completed.has(l.id)) || ORDER[0];
    const trackCard = t => {
      const st = trackStats(t);
      return `<section class="track-card" aria-labelledby="tc-${t}">
        <div class="track-top"><p class="eyebrow" style="margin:0">${TRACKS[t].label}</p><span>${st.done}/${st.total} done</span></div>
        <h2 id="tc-${t}">${TRACKS[t].name}</h2>
        <div class="meter"><i style="width:${st.total ? st.done / st.total * 100 : 0}%"></i></div>
        <ol>${byTrack(t).map(l => `<li><a href="#${l.id}" class="${S.completed.has(l.id) ? 'done' : ''}"><span class="nav-num">${S.completed.has(l.id) ? '✓' : l.n}</span><span>${l.title}</span></a></li>`).join('')}</ol>
      </section>`;
    };
    return `<div class="page wide">
      <section class="hero">
        <p class="eyebrow"><span>Field course</span><span class="dot"></span><span>${ORDER.length} lessons</span><span class="dot"></span><span>~3 hours</span></p>
        <h1 tabindex="-1" id="page-title">PM &amp; Scrum Fundamentals</h1>
        <p class="lead">How product management and Scrum work day to day, for an APM shipping AI features to wealth managers and partners. Every example comes from B2B wealth-tech: advisor workflows, compliance, AUM in ₹ crore, and models that sometimes get things wrong.</p>
        <div class="btnrow" style="margin-top:22px">
          ${resume ? `<a class="btn btn-primary" href="#${resume.id}">${S.completed.size ? 'Continue' : 'Start'}: ${resume.short || resume.title}</a>` : ''}
          <a class="btn" href="#simulator">Try the Sprint simulator</a>
        </div>
      </section>
      <div class="anatomy" aria-label="How each lesson is structured">
        <div><b>Idea</b><span>The lesson in one line</span></div>
        <div><b>Explain</b><span>Plain-English concept</span></div>
        <div><b>Example</b><span>A wealth-tech AI case</span></div>
        <div><b>Mistakes</b><span>Traps new PMs fall into</span></div>
        <div><b>Try it</b><span>Exercise + model answer</span></div>
        <div><b>Check</b><span>Quiz with explanations</span></div>
      </div>
      <div class="home-grid">${trackCard('pm')}${trackCard('scrum')}</div>
      <div class="tools">
        <a class="tool" href="#simulator">${IC.sim}<b>Sprint simulator</b><span>Run a 2-week Sprint and handle a mid-Sprint request from Sales.</span></a>
        <a class="tool" href="#flashcards">${IC.cards}<b>Flashcards</b><span>Drill the key PM and Scrum terms.</span></a>
        <a class="tool" href="#glossary">${IC.gloss}<b>Glossary</b><span>Searchable, with Scrum Guide terms flagged.</span></a>
        <a class="tool" href="#cheatsheet">${IC.sheet}<b>Cheat sheet</b><span>Frameworks, templates and timeboxes on one printable page.</span></a>
      </div>
    </div>`;
  }

  /* ---------- Glossary ---------- */
  const G = { q: '', f: 'all' };
  function glossaryList() {
    const q = G.q.trim().toLowerCase();
    const items = GLOSSARY.filter(g => {
      if (G.f === 'pm' && g.track !== 'pm') return false;
      if (G.f === 'scrum' && g.track !== 'scrum') return false;
      if (G.f === 'sg' && !g.sg) return false;
      if (!q) return true;
      return (g.term + ' ' + (g.aka || '') + ' ' + g.def).toLowerCase().includes(q);
    }).sort((a, b) => a.term.localeCompare(b.term));
    let html = '';
    let letter = '';
    items.forEach(g => {
      const L = /[a-z]/i.test(g.term[0]) ? g.term[0].toUpperCase() : '#';
      if (L !== letter) { letter = L; html += `<h2 class="gl-letter">${L}</h2>`; }
      const lesson = g.lesson && LMAP[g.lesson];
      html += `<div class="gl-item">
        <div class="gl-term"><h3>${esc(g.term)}</h3>
          <span class="badge ${g.track === 'pm' ? 'pm' : ''}">${g.track === 'pm' ? 'PM' : 'Scrum'}</span>
          ${g.sg ? '<span class="badge sg">Scrum Guide term</span>' : ''}${g.np ? '<span class="badge np">Not in Scrum Guide</span>' : ''}
        </div>
        <p class="gl-def">${g.def}${lesson ? ` <a class="gl-link" href="#${lesson.id}">Lesson: ${lesson.short || lesson.title} →</a>` : ''}</p>
      </div>`;
    });
    $('#gl-count').textContent = `${items.length} of ${GLOSSARY.length} terms`;
    $('#gl-list').innerHTML = html || `<p class="empty">No terms match “${esc(G.q)}”. Try a shorter word, or clear the filter.</p>`;
  }
  function glossaryPage() {
    const chip = (v, label) => `<button type="button" class="chip" data-action="gl-filter" data-v="${v}" aria-pressed="${G.f === v}">${label}</button>`;
    return `<div class="page">
      <p class="eyebrow"><span>Reference</span></p>
      <h1 tabindex="-1" id="page-title">Glossary</h1>
      <p class="lead">PM and Scrum vocabulary in plain English. Terms defined by the official Scrum Guide are flagged, and so are popular practices the Guide doesn't mention.</p>
      <div class="searchbar">
        <label class="sr-only" for="gl-q">Search the glossary</label>
        <input class="search" id="gl-q" type="search" placeholder="Search terms, e.g. velocity, RICE, increment" value="${esc(G.q)}" autocomplete="off">
        <div class="chips">${chip('all', 'All')}${chip('pm', 'PM')}${chip('scrum', 'Scrum')}${chip('sg', 'Scrum Guide terms')}<span class="count" id="gl-count"></span></div>
      </div>
      <div id="gl-list"></div>
    </div>`;
  }

  /* ---------- Flashcards ---------- */
  const F = { f: store.get('fcFilter', 'all'), order: null, i: 0, flipped: false };
  function fcDeck() {
    let cards = GLOSSARY.filter(g => g.card);
    if (F.f === 'pm') cards = cards.filter(c => c.track === 'pm');
    if (F.f === 'scrum') cards = cards.filter(c => c.track === 'scrum');
    if (F.f === 'learning') cards = cards.filter(c => !S.known.has(c.term));
    if (F.order) {
      const pos = new Map(F.order.map((t, i) => [t, i]));
      cards = cards.slice().sort((a, b) => (pos.has(a.term) ? pos.get(a.term) : 1e6) - (pos.has(b.term) ? pos.get(b.term) : 1e6));
    }
    return cards;
  }
  function flashcardsInner() {
    const deck = fcDeck();
    const all = GLOSSARY.filter(g => g.card);
    const knownCount = all.filter(c => S.known.has(c.term)).length;
    if (!deck.length) {
      return `<div class="empty"><p>${F.f === 'learning' ? 'You know every card in the deck. Nice work.' : 'No cards in this deck.'}</p><button type="button" class="btn" data-action="fc-filter" data-v="all">Show all cards</button></div>`;
    }
    if (F.i >= deck.length) F.i = 0;
    const c = deck[F.i];
    const isKnown = S.known.has(c.term);
    return `<div class="fc-stage">
        <button type="button" class="fc${F.flipped ? ' flipped' : ''}" id="fc-card" data-action="fc-flip" aria-label="${F.flipped ? 'Definition shown. Press to show the term' : 'Term shown. Press to reveal the definition'}">
          <span class="fc-inner">
            <span class="fc-face fc-front" aria-hidden="${F.flipped}">
              ${isKnown ? '<span class="badge sg fc-known">Known</span>' : ''}
              <span class="badge ${c.track === 'pm' ? 'pm' : ''}">${c.track === 'pm' ? 'PM' : 'Scrum'}${c.sg ? ' · Scrum Guide' : ''}${c.np ? ' · not in Guide' : ''}</span>
              <span class="fc-term">${esc(c.term)}</span>
              <span class="fc-hint">Tap or press space to flip</span>
            </span>
            <span class="fc-face fc-back" aria-hidden="${!F.flipped}">
              <span class="fc-hint">${esc(c.term)}</span>
              <span class="fc-def">${c.def}</span>
            </span>
          </span>
        </button>
      </div>
      <div class="fc-bar">
        <span class="fc-pos">Card ${F.i + 1} / ${deck.length} · ${knownCount}/${all.length} known</span>
        <div class="btnrow">
          <button type="button" class="btn btn-sm" data-action="fc-prev" aria-label="Previous card">←</button>
          <button type="button" class="btn btn-sm" data-action="fc-again">Still learning</button>
          <button type="button" class="btn btn-sm btn-primary" data-action="fc-know">${isKnown ? 'Known ✓ · next' : 'I know this'}</button>
          <button type="button" class="btn btn-sm" data-action="fc-next" aria-label="Next card">→</button>
        </div>
      </div>`;
  }
  function flashcardsPage() {
    const chip = (v, label) => `<button type="button" class="chip" data-action="fc-filter" data-v="${v}" aria-pressed="${F.f === v}">${label}</button>`;
    return `<div class="page">
      <p class="eyebrow"><span>Practice</span></p>
      <h1 tabindex="-1" id="page-title">Flashcards</h1>
      <p class="lead">Say the definition out loud, then flip to check. Cards you mark “I know this” drop out of the “Still learning” deck.</p>
      <div class="fc-wrap">
        <div class="chips">${chip('all', 'All cards')}${chip('pm', 'PM')}${chip('scrum', 'Scrum')}${chip('learning', 'Still learning')}
          <button type="button" class="chip" data-action="fc-shuffle">Shuffle</button>
          <button type="button" class="chip" data-action="fc-unknow">Reset known</button></div>
        <div id="fc-body">${flashcardsInner()}</div>
        <p class="fc-hint" style="text-align:center">Keyboard: <span class="kbd">Space</span> flip · <span class="kbd">←</span> <span class="kbd">→</span> move · <span class="kbd">K</span> know it · <span class="kbd">L</span> still learning</p>
      </div>
    </div>`;
  }
  function fcRefresh() { const b = $('#fc-body'); if (b) b.innerHTML = flashcardsInner(); renderNav('flashcards'); }

  /* ---------- Sprint simulator ---------- */
  const METERS = [['goal', 'Sprint Goal'], ['trust', 'Stakeholder trust'], ['team', 'Team health']];
  const clamp = v => Math.max(0, Math.min(100, v));
  function simNew() { return { i: 0, picks: [], m: { goal: 60, trust: 60, team: 60 }, last: null }; }
  function simState() { if (!S.sim || !Array.isArray(S.sim.picks)) S.sim = simNew(); return S.sim; }
  function simMax() { return SIM.steps.reduce((a, s) => a + Math.max(...s.options.map(o => o.s)), 0); }
  function simScore(st) { return st.picks.reduce((a, p, i) => a + (SIM.steps[i] ? SIM.steps[i].options[p].s : 0), 0); }
  function gaugesHTML(st) {
    return `<div class="gauges">${METERS.map(([k, label]) => {
      const v = st.m[k];
      const d = st.last && st.last[k] ? st.last[k] : 0;
      const cls = v < 40 ? 'lo' : v < 65 ? 'mid' : '';
      return `<div class="gauge"><div class="gauge-top"><span>${label}</span><b>${v}${d ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</span>` : ''}</b></div>
        <div class="meter" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><i class="${cls}" style="width:${v}%"></i></div></div>`;
    }).join('')}</div>`;
  }
  function timelineHTML(day) {
    return `<div class="timeline" aria-label="Sprint day ${day} of 10">${Array.from({ length: 10 }, (_, i) => {
      const d = i + 1;
      return `<div class="tl-day ${d < day ? 'past' : d === day ? 'now' : ''}"><i></i><span>D${d}</span></div>`;
    }).join('')}</div>`;
  }
  function simInner() {
    const st = simState();
    const steps = SIM.steps;
    if (!steps.length) return '<p class="empty">Simulator content is loading.</p>';
    if (st.i >= steps.length) {
      const score = simScore(st);
      const pct = Math.round(score / simMax() * 100);
      const rating = SIM.ratings.find(r => pct >= r.min);
      return `${timelineHTML(11)}${gaugesHTML(st)}
        <div class="scene">
          <div class="scene-tag"><span class="badge sg">Sprint complete</span></div>
          <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><span class="score-big">${pct}%</span><div><h2>${rating.title}</h2><p class="lead" style="margin-top:6px;font-size:1rem">${rating.text}</p></div></div>
          <h3 style="font-size:1.05rem;margin-top:6px">Your decisions</h3>
          <ol class="recap">${steps.map((s, i) => {
            const o = s.options[st.picks[i]];
            const best = s.options.reduce((a, b) => (b.s > a.s ? b : a));
            return `<li><div class="r-top"><span>Day ${s.day} · ${s.phase}</span><span>${o.s}/${best.s}</span></div>
              <b>${s.title}</b><span>You chose: ${o.t}</span>${o !== best ? `<span style="color:var(--good)">Strongest move: ${best.t}</span>` : ''}
              ${s.lesson && LMAP[s.lesson] ? `<a href="#${s.lesson}" style="font-size:.82rem">Review: ${LMAP[s.lesson].short || LMAP[s.lesson].title} →</a>` : ''}</li>`;
          }).join('')}</ol>
          <div class="btnrow"><button type="button" class="btn btn-primary" data-action="sim-restart">Run the Sprint again</button><a class="btn" href="#cheatsheet">Open the cheat sheet</a></div>
        </div>`;
    }
    const s = steps[st.i];
    const pick = st.picks[st.i];
    const answered = pick !== undefined;
    const o = answered ? s.options[pick] : null;
    const max = Math.max(...s.options.map(x => x.s));
    const lvl = o ? (o.s >= max ? 's-hi' : o.s >= max / 2 ? 's-mid' : 's-lo') : '';
    return `${timelineHTML(s.day)}${gaugesHTML(st)}
      <div class="scene" id="scene">
        <div class="scene-tag"><span class="badge">Decision ${st.i + 1} of ${steps.length}</span><span class="badge sg">Day ${s.day} · ${s.phase}</span></div>
        <h2 tabindex="-1" id="scene-title">${s.title}</h2>
        <div class="prose">${s.scene}</div>
        <ol class="choices${answered ? ' locked' : ''}">${s.options.map((c, ci) => `<li><button type="button" class="choice${pick === ci ? ' picked' : ''}" data-action="sim-pick" data-o="${ci}"${answered ? ' aria-disabled="true"' : ''}><span class="opt-key">${'ABCD'[ci]}</span><span>${c.t}</span></button></li>`).join('')}</ol>
        ${o ? `<div class="fb ${lvl}" id="sim-fb"><div class="fb-h"><span>${o.s >= max ? 'Strong move' : o.s >= max / 2 ? 'Partly right' : 'Risky move'}</span><span>+${o.s} of ${max} pts</span></div><p>${o.fb}</p>${o.ref ? `<p class="ref">${ICON_BOOK.replace('<svg', '<svg width="13" height="13" style="vertical-align:-2px;margin-right:4px"')}${o.ref}</p>` : ''}</div>
          <div class="btnrow"><button type="button" class="btn btn-primary" data-action="sim-next">${st.i + 1 < steps.length ? 'Continue the Sprint →' : 'See how the Sprint went →'}</button></div>` : ''}
      </div>`;
  }
  function simulatorPage() {
    return `<div class="page">
      <p class="eyebrow"><span>Practice</span><span class="dot"></span><span>${SIM.steps.length} decisions</span>${S.simBest != null ? `<span class="dot"></span><span>Best ${S.simBest}%</span>` : ''}</p>
      <h1 tabindex="-1" id="page-title">${SIM.title || 'Sprint simulator'}</h1>
      <div class="prose" style="margin-top:14px">${SIM.intro || ''}</div>
      <div class="sim" id="sim-body">${simInner()}</div>
      <p class="btnrow" style="margin-top:18px"><button type="button" class="linkbtn" data-action="sim-restart">Restart the simulator</button></p>
    </div>`;
  }
  function simRefresh(focusSel) {
    const b = $('#sim-body');
    if (b) b.innerHTML = simInner();
    if (focusSel) { const el = $(focusSel); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }
  }

  /* ---------- Cheat sheet ---------- */
  function cheatPage() {
    return `<div class="page wide">
      <div class="cheat-head">
        <p class="eyebrow"><span>Reference</span><span class="dot"></span><span>Scrum content per the Scrum Guide (Nov 2020)</span></p>
        <h1 tabindex="-1" id="page-title">Cheat sheet</h1>
        <p class="lead">The whole course on one page.${inFrame ? ' To print it, open the file directly in your browser and press Ctrl/Cmd + P.' : ' Press Ctrl/Cmd + P or use the button to print it on one A4 sheet.'}</p>
        ${inFrame ? '' : '<div class="btnrow no-print" style="margin-top:16px"><button type="button" class="btn btn-primary" data-action="print">Print cheat sheet</button></div>'}
      </div>
      <div class="cheat">${CHEAT}</div>
    </div>`;
  }

  /* ---------- Router ---------- */
  function route() {
    const h = (location.hash || '').replace(/^#\/?/, '') || 'home';
    return h;
  }
  function render() {
    const r = route();
    const main = $('#main');
    let html;
    if (LMAP[r]) { html = lessonPage(LMAP[r]); S.last = r; persist('last'); }
    else if (r === 'glossary') html = glossaryPage();
    else if (r === 'flashcards') html = flashcardsPage();
    else if (r === 'simulator') html = simulatorPage();
    else if (r === 'cheatsheet') html = cheatPage();
    else html = homePage();
    main.innerHTML = html;
    if (r === 'glossary') glossaryList();
    $$('[data-widget]', main).forEach(el => { const w = WIDGETS[el.dataset.widget]; if (w && w.mount) w.mount(el, store); });
    renderNav(LMAP[r] || ['glossary', 'flashcards', 'simulator', 'cheatsheet'].includes(r) ? r : 'home');
    const t = LMAP[r] ? (LMAP[r].title + ' · ') : r !== 'home' && ['glossary', 'flashcards', 'simulator', 'cheatsheet'].includes(r) ? ({ glossary: 'Glossary', flashcards: 'Flashcards', simulator: 'Sprint simulator', cheatsheet: 'Cheat sheet' }[r] + ' · ') : '';
    document.title = t + 'PM & Scrum Fundamentals';
  }
  function navigate() {
    closeMenu();
    render();
    window.scrollTo(0, 0);
    const h = $('#page-title');
    if (h) h.focus({ preventScroll: true });
  }

  /* ---------- Menu (mobile drawer) ---------- */
  function openMenu() { $('#sidebar').classList.add('open'); $('.scrim').classList.add('open'); $('[data-action="menu"]').setAttribute('aria-expanded', 'true'); const a = $('#sidebar a[aria-current="page"]') || $('#sidebar a'); if (a) a.focus(); }
  function closeMenu() { const sb = $('#sidebar'); if (!sb.classList.contains('open')) return; sb.classList.remove('open'); $('.scrim').classList.remove('open'); $('[data-action="menu"]').setAttribute('aria-expanded', 'false'); }

  /* ---------- Actions ---------- */
  function setComplete(id, on) {
    if (on) S.completed.add(id); else S.completed.delete(id);
    persist('completed');
  }
  let resetArmed = null;
  const actions = {
    menu: () => openMenu(),
    'close-menu': () => closeMenu(),
    theme: el => { S.theme = el.dataset.v; persist('theme'); applyTheme(); renderNav(route()); },
    reset: el => {
      if (!resetArmed) {
        el.textContent = 'Click again to erase all progress';
        el.classList.add('armed');
        resetArmed = setTimeout(() => { resetArmed = null; el.textContent = 'Reset all progress'; el.classList.remove('armed'); }, 4000);
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      const theme = S.theme;
      store.reset();
      S.completed = new Set(); S.quiz = {}; S.drafts = {}; S.revealed = {}; S.cls = {}; S.known = new Set(); S.sim = null; S.simBest = null; S.last = null;
      S.theme = theme; persist('theme');
      F.order = null; F.i = 0; F.flipped = false;
      render();
      live('All progress erased.');
    },
    answer: el => {
      const { l, q, o } = el.dataset;
      const lesson = LMAP[l];
      S.quiz[l] = S.quiz[l] || {};
      if (S.quiz[l][q] !== undefined) return;
      S.quiz[l][q] = +o;
      persist('quiz');
      const ok = lesson.quiz[q].o[o][1];
      const ans = S.quiz[l];
      const n = lesson.quiz.length;
      if (Object.keys(ans).length === n) {
        const correct = lesson.quiz.filter((qq, qi) => qq.o[ans[qi]][1]).length;
        if (correct >= Math.max(1, n - 1) && !S.completed.has(l)) { setComplete(l, true); }
      }
      const box = $('#quiz-' + l);
      box.outerHTML = quizHTML(lesson);
      const btn = $(`#quiz-${l} [data-q="${q}"][data-o="${o}"]`);
      if (btn) btn.focus({ preventScroll: true });
      syncLessonChrome(lesson);
      live(ok ? 'Correct.' : 'Not quite. The explanation is shown under each option.');
    },
    'quiz-retry': el => {
      const l = el.dataset.l;
      delete S.quiz[l]; persist('quiz');
      const box = $('#quiz-' + l);
      box.outerHTML = quizHTML(LMAP[l]);
      const first = $(`#quiz-${l} .opt`);
      if (first) first.focus();
    },
    complete: el => {
      const l = el.dataset.l;
      setComplete(l, !S.completed.has(l));
      syncLessonChrome(LMAP[l]);
      live(S.completed.has(l) ? 'Lesson marked complete.' : 'Lesson marked not complete.');
    },
    reveal: el => {
      const l = el.dataset.l;
      S.revealed[l] = !S.revealed[l]; persist('revealed');
      const m = $('#model-' + l);
      m.hidden = !S.revealed[l];
      el.textContent = S.revealed[l] ? 'Hide model answer' : 'Reveal model answer';
      el.setAttribute('aria-expanded', String(!!S.revealed[l]));
    },
    'cls-pick': el => {
      const { l, i, b } = el.dataset;
      const st = S.cls[l] || { picks: {}, checked: false };
      st.picks[i] = +b; st.checked = false;
      S.cls[l] = st; persist('cls');
      $('#cls-' + l).outerHTML = classifyHTML(LMAP[l]);
      const again = $(`#cls-${l} [data-i="${i}"][data-b="${b}"]`); if (again) again.focus({ preventScroll: true });
    },
    'cls-check': el => {
      const l = el.dataset.l;
      const st = S.cls[l] || { picks: {}, checked: false };
      st.checked = true; S.cls[l] = st; persist('cls');
      $('#cls-' + l).outerHTML = classifyHTML(LMAP[l]);
      const c = LMAP[l].tryit.classify;
      const correct = c.items.filter((it, i) => st.picks[i] === it[1]).length;
      live(`${correct} of ${c.items.length} right.`);
    },
    'cls-reset': el => {
      const l = el.dataset.l;
      delete S.cls[l]; persist('cls');
      $('#cls-' + l).outerHTML = classifyHTML(LMAP[l]);
    },
    'gl-filter': el => { G.f = el.dataset.v; $$('[data-action="gl-filter"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === G.f))); glossaryList(); },
    'fc-flip': () => {
      const c = $('#fc-card'); if (!c) return;
      F.flipped = !F.flipped;
      c.classList.toggle('flipped', F.flipped);
      c.setAttribute('aria-label', F.flipped ? 'Definition shown. Press to show the term' : 'Term shown. Press to reveal the definition');
      $('.fc-front', c).setAttribute('aria-hidden', String(F.flipped));
      $('.fc-back', c).setAttribute('aria-hidden', String(!F.flipped));
      live(F.flipped ? $('.fc-def', c).textContent : $('.fc-term', c).textContent);
    },
    'fc-next': () => { const n = fcDeck().length; if (!n) return; F.i = (F.i + 1) % n; F.flipped = false; fcRefresh(); },
    'fc-prev': () => { const n = fcDeck().length; if (!n) return; F.i = (F.i - 1 + n) % n; F.flipped = false; fcRefresh(); },
    'fc-know': () => {
      const deck = fcDeck(); if (!deck.length) return;
      S.known.add(deck[F.i].term); persist('known');
      F.flipped = false;
      if (F.f !== 'learning') F.i = (F.i + 1) % deck.length;
      fcRefresh(); live('Marked as known.');
    },
    'fc-again': () => {
      const deck = fcDeck(); if (!deck.length) return;
      S.known.delete(deck[F.i].term); persist('known');
      F.flipped = false; F.i = (F.i + 1) % deck.length;
      fcRefresh();
    },
    'fc-filter': el => { F.f = el.dataset.v; store.set('fcFilter', F.f); F.i = 0; F.flipped = false; $$('[data-action="fc-filter"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === F.f))); fcRefresh(); },
    'fc-shuffle': () => {
      const terms = GLOSSARY.filter(g => g.card).map(g => g.term);
      for (let i = terms.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [terms[i], terms[j]] = [terms[j], terms[i]]; }
      F.order = terms; F.i = 0; F.flipped = false; fcRefresh(); live('Deck shuffled.');
    },
    'fc-unknow': () => { S.known = new Set(); persist('known'); F.i = 0; F.flipped = false; fcRefresh(); live('All cards reset to still learning.'); },
    'sim-pick': el => {
      const st = simState();
      if (st.picks[st.i] !== undefined) return;
      const o = SIM.steps[st.i].options[+el.dataset.o];
      st.picks[st.i] = +el.dataset.o;
      const fx = o.fx || {};
      st.last = {};
      METERS.forEach(([k]) => { const before = st.m[k]; st.m[k] = clamp(before + (fx[k] || 0)); st.last[k] = st.m[k] - before; });
      persist('sim');
      simRefresh('#sim-fb');
    },
    'sim-next': () => {
      const st = simState();
      st.i += 1; st.last = null;
      if (st.i >= SIM.steps.length) {
        const pct = Math.round(simScore(st) / simMax() * 100);
        if (S.simBest == null || pct > S.simBest) { S.simBest = pct; persist('simBest'); }
        renderNav('simulator');
      }
      persist('sim');
      simRefresh(st.i < SIM.steps.length ? '#scene-title' : '.scene');
    },
    'sim-restart': () => { S.sim = simNew(); persist('sim'); simRefresh('#scene-title'); },
    print: () => { try { window.print(); } catch (e) { /* print unavailable */ } }
  };
  function syncLessonChrome(lesson) {
    const done = S.completed.has(lesson.id);
    const b = $('.complete-btn');
    if (b) { b.setAttribute('aria-pressed', String(done)); b.textContent = done ? '✓ Completed · click to undo' : 'Mark lesson complete'; }
    renderNav(lesson.id);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.getAttribute('aria-disabled') === 'true' || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el); }
  });
  let draftTimer = null;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'gl-q') { G.q = t.value; glossaryList(); return; }
    if (t.classList.contains('draft')) {
      const l = t.dataset.l;
      clearTimeout(draftTimer);
      draftTimer = setTimeout(() => {
        S.drafts[l] = t.value; persist('drafts');
        const m = $('#draft-meta-' + l); if (m) m.textContent = store.available ? 'Draft saved' : 'Draft kept for this session (storage is blocked)';
      }, 350);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMenu();
    if (route() !== 'flashcards') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    const onButton = tag === 'button' && e.target.id !== 'fc-card';
    if (e.key === ' ' && !onButton) { e.preventDefault(); actions['fc-flip'](); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); actions['fc-next'](); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); actions['fc-prev'](); }
    else if (e.key.toLowerCase() === 'k') actions['fc-know']();
    else if (e.key.toLowerCase() === 'l') actions['fc-again']();
  });
  window.addEventListener('hashchange', navigate);
  window.addEventListener('resize', () => { if (window.innerWidth > 900) closeMenu(); });

  render();
})();
</script>
</body>
</html>
