LESSONS.push({
  id: 'scrum-6', track: 'scrum', n: 6, minutes: 12,
  title: 'Common Scrum anti-patterns', short: 'Anti-patterns',
  sub: 'Status-meeting standups, ticket-list Sprint Goals, skipped retrospectives, order-taker POs, and how to fix them.',
  idea: 'Most Scrum failures aren’t missing ceremonies. They’re teams going through the events after the purpose has gone.',
  body: `
${table(['Anti-pattern', 'Symptom', 'Why it hurts', 'Fix'], [
  ['<strong>Status-meeting standup</strong>', 'Each Developer reports to the PM or CTO in turn. It runs 30 minutes. Nobody mentions the Sprint Goal.', 'The Daily Scrum is for the Developers to adapt their plan. Reporting replaces self-management.', 'Developers run it and focus on the Sprint Goal (“Are we on track? What’s blocking us?”). Walk the board from right to left. The PM listens, or isn’t there.'],
  ['<strong>Ticket-list Sprint Goal</strong>', '“Complete BRF-231, 232, 236 and 3 bugs.”', 'No why and no flexibility. The Guide intends the Sprint Goal as one objective that allows the scope to flex.', 'Write one outcome-oriented objective and select the items that serve it.'],
  ['<strong>Skipped or rushed retrospectives</strong>', '“No time this Sprint.” The same problems keep coming back.', 'You lose Scrum’s formal moment to inspect and adapt how the team works.', 'Keep it short but never skip it. Pick one or two actions, put the top one in the next Sprint Backlog, and check last time’s actions first.'],
  ['<strong>PO as order-taker, or proxy PO</strong>', 'Every stakeholder request goes to the top. The PO can’t say no. Decisions get escalated.', 'Nobody maximizes value, and the backlog becomes a queue of whoever shouted loudest.', 'The PO owns the ordering and the Product Goal. Stakeholders influence through the PO, and the organization respects those decisions.'],
  ['<strong>Sprint Review as demo theater</strong>', 'A slide deck, no working product, no stakeholder feedback, a backlog that never changes.', 'Inspection without adaptation is pointless.', 'Run a working session with the real Increment and real stakeholders, and decide together what’s next.'],
  ['<strong>Undone work and “hardening Sprints”</strong>', 'Work is “done” when merged. QA and compliance checks happen in a stabilization Sprint each quarter.', 'Transparency breaks and risk piles up. Each Sprint should produce a usable Increment.', 'Strengthen the Definition of Done until “Done” really means releasable.'],
  ['<strong>Mid-Sprint scope bombs</strong>', 'Stakeholders message engineers directly with “quick” requests.', 'It endangers the Sprint Goal, bypasses the PO and hides the trade-off.', 'Route every request through the PO. Renegotiate scope without endangering the Sprint Goal.'],
  ['<strong>Velocity as a KPI</strong>', '“Increase velocity 20% this quarter.”', 'Point inflation and an end to honest forecasting.', 'Measure outcomes and flow instead: cycle time, and advisor results.']
])}
${guide('<p>The Guide’s own words are the best counter-arguments: the Daily Scrum is “for the Developers”; the Sprint Review “is a working session and the Scrum Team should avoid limiting it to a presentation”; during the Sprint “no changes are made that would endanger the Sprint Goal” and “quality does not decrease”; “for Product Owners to succeed, the entire organization must respect their decisions.”', 'The Scrum Guide on these')}`,
  example: {
    title: 'Diagnosing Sprint 12',
    html: `
<p>What happened in Sprint 12 on your team:</p>
<ul>
  <li>The Daily Scrum ran 35 minutes, with each engineer reporting to the CTO.</li>
  <li>The Sprint Goal was “finish KYC-112, KYC-118, BRF-21, BRF-24, plus bugfixes”.</li>
  <li>On day 6, the Head of Sales messaged an engineer directly asking for a custom export for a prospect demo. The engineer built it, and BRF-24 slipped.</li>
  <li>At the Sprint Review the team showed slides. The CTO said “looks good”. Nothing changed in the backlog.</li>
  <li>The retrospective was cancelled for a partner call.</li>
</ul>
<p><strong>Diagnosis:</strong> a status-meeting standup, a ticket-list goal, a mid-Sprint scope bomb, demo theater and a skipped retro. That’s five anti-patterns.</p>
<p><strong>Where to start:</strong> fix the <strong>Sprint Goal</strong> and the <strong>intake route</strong> first. A real objective gives the Daily Scrum something to inspect and gives the PO a basis for saying “not this Sprint”. A single intake route through the PO stops the scope bombs. Then reinstate the retrospective, and use it to tackle the rest one at a time.</p>`
  },
  mistakes: [
    'Running the Daily Scrum yourself because “someone has to”.',
    'Accepting stakeholder requests over DM and passing them straight to engineers.',
    'Writing the Sprint Goal after Planning as a summary of the tickets.',
    'Treating the retrospective as optional, or as a venting session that produces no actions.',
    'Marking work Done so the Sprint Review looks good.'
  ],
  tryit: {
    prompt: `<p><strong>Part 1:</strong> name the anti-pattern in each scenario.</p>
<p><strong>Part 2 (box below):</strong> choose one scenario and write the first concrete change you would propose to the team, worded as you would actually say it.</p>`,
    placeholder: 'Scenario: …\nWhat I would say to the team: …',
    classify: {
      buckets: ['Status standup', 'Ticket-list goal', 'Order-taker PO', 'Demo theater', 'Undone work'],
      items: [
        ['Every morning each engineer tells the CTO what they did yesterday. It takes 30 minutes.', 0, 'Reporting upward, not Developers adapting their plan towards the Sprint Goal.'],
        ['The Sprint Goal reads “Close JIRA-404, 405, 409 and 3 bugs.”', 1, 'No objective, no why and no flexibility.'],
        ['The PO puts every request from Sales at the top of the backlog to avoid conflict.', 2, 'Nobody is ordering for value. The PO has become a router.'],
        ['The Sprint Review is a 12-slide deck. Stakeholders never touch the product.', 3, 'A presentation instead of a working session, so no real inspection happens.'],
        ['Stories are “done” when merged. QA and compliance checks happen in a “release Sprint” each quarter.', 4, 'A weak Definition of Done hides undone work and piles up risk.']
      ]
    },
    model: `<p><strong>Part 1:</strong> 1 status standup · 2 ticket-list goal · 3 order-taker PO · 4 demo theater · 5 undone work.</p>
<p><strong>Part 2 (example for scenario 1):</strong> “I’d like to suggest an experiment for the next two Sprints. The Daily Scrum is yours. The CTO and I will skip it, and you run it around the Sprint Goal: are we on track, and what’s in the way? Walk the board from right to left so we finish things before starting new ones. I’ll sync with the CTO separately using the board, so nobody has to report to us. We’ll check at the retro whether it helped.”</p>`
  },
  quiz: [
    { q: 'The Daily Scrum has turned into a status report to you. What’s the best first move?', o: [
      ['Ask everyone to send written status updates instead.', false, 'That replaces one reporting ritual with another. The Daily Scrum is for the Developers to plan.'],
      ['Step back and let the Developers run it around progress towards the Sprint Goal. Attend only if it’s useful, and stay quiet.', true, 'You restore its purpose, and you can get status from the board instead.'],
      ['Extend it to 30 minutes so everyone can report.', false, 'The 15-minute timebox exists for a reason. Longer reporting doesn’t fix anything.'],
      ['Cancel it.', false, 'It’s a core Scrum event. Fix it rather than removing it.']
    ] },
    { q: 'Which is the best Sprint Goal?', o: [
      ['“Complete stories 231, 232 and 236.”', false, 'That’s a ticket list, with no objective and no flexibility.'],
      ['“Pilot advisors can generate an accurate brief for mutual fund clients.”', true, 'One objective that explains the value and lets the scope flex.'],
      ['“Work hard on the brief.”', false, 'There’s no way to tell whether it was achieved.'],
      ['“Deliver 40 points.”', false, 'Output, not value. It also turns velocity into a target.']
    ] },
    { q: 'A stakeholder messages an engineer directly to add a “quick” export mid-Sprint. What should happen?', o: [
      ['The engineer quietly does it.', false, 'This hides the trade-off and endangers the Sprint Goal.'],
      ['It goes to the PO. Usually it goes into the Product Backlog. If it serves the Sprint Goal and the Developers agree, scope can be renegotiated.', true, 'Scope may be renegotiated with the PO, but no changes that endanger the Sprint Goal.'],
      ['The Scrum Master assigns it to someone.', false, 'The SM doesn’t assign work, and the request still bypasses the PO.'],
      ['Cancel the Sprint.', false, 'Only the PO can cancel a Sprint, and only when the Sprint Goal becomes obsolete. A side request doesn’t do that.']
    ] },
    { q: 'The team keeps skipping retrospectives because of deadlines. Why is that risky?', o: [
      ['It isn’t. Retros are optional.', false, 'The Retrospective is one of Scrum’s formal events and concludes the Sprint.'],
      ['It removes the formal moment to inspect and adapt how the team works, so problems keep repeating.', true, 'Teams under pressure need it most.'],
      ['Scrum Masters are paid per retro.', false, 'This isn’t a real concern.'],
      ['The Guide says retros can be skipped in busy Sprints.', false, 'It says no such thing.']
    ] }
  ]
});

LESSONS.push({
  id: 'scrum-7', track: 'scrum', n: 7, minutes: 12,
  title: 'Kanban basics, and mixing Scrum with Kanban', short: 'Kanban',
  sub: 'Visualize the work, limit work in progress, manage flow, and know when to combine it with Scrum.',
  idea: 'Kanban improves the flow of work by visualizing it, limiting work in progress and actively managing items. Scrum teams often add Kanban practices to improve flow inside their Sprints.',
  body: `
<h3>Kanban in one paragraph</h3>
<p>Kanban is a strategy for optimizing the flow of value through a process. The Kanban Guide (Vacanti &amp; Coleman) describes three practices: <strong>defining and visualizing the workflow</strong>, <strong>actively managing items in the workflow</strong> and <strong>improving the workflow</strong>. A team’s “Definition of Workflow” states what counts as work, when work is <em>started</em> and <em>finished</em>, the states in between, the <strong>WIP limits</strong>, and a <strong>service level expectation</strong> (SLE), such as “85% of items finish within 5 days”.</p>
${fig(DIAG.kanban, 'Columns show workflow states and WIP limits cap each one. When a column is full, people help finish work instead of starting new work.')}
<h3>Four flow metrics</h3>
${table(['Metric', 'Meaning'], [
  ['<strong>WIP</strong>', 'Items started but not finished'],
  ['<strong>Throughput</strong>', 'Items finished per unit of time'],
  ['<strong>Work Item Age</strong>', 'Time since an in-progress item started'],
  ['<strong>Cycle Time</strong>', 'Time from start to finish for completed items']
])}
<p class="formula">Little’s Law: average Cycle Time = average WIP ÷ average Throughput</p>
<p>If 10 feature items are in progress and the team finishes 5 a week, items take about 2 weeks on average, which is a whole Sprint. Halve the WIP to 5 and cycle time drops to about 1 week, with no extra effort.</p>
<h3>Kanban vs Scrum</h3>
${table(['', 'Scrum', 'Kanban'], [
  ['Cadence', 'Fixed-length Sprints of one month or less', 'Continuous flow. Cadences are optional.'],
  ['Accountabilities', 'PO, SM, Developers', 'None prescribed'],
  ['Commitment', 'Sprint Goal, Product Goal, Definition of Done', 'WIP limits and SLEs'],
  ['Best fit', 'Complex product development towards goals', 'Continuous, interrupt-driven streams with service expectations']
])}
${practice(`<ul>
  <li>Scrum.org publishes the <strong>Kanban Guide for Scrum Teams</strong>. Scrum Teams keep all of Scrum (events, artifacts, accountabilities) and add flow practices: a visualized workflow, WIP limits and flow metrics.</li>
  <li>Flow metrics feed the Scrum events: <strong>throughput</strong> helps forecast in Sprint Planning, <strong>Work Item Age</strong> focuses the Daily Scrum, and the <strong>Retrospective</strong> inspects the workflow and its WIP limits.</li>
  <li>“Scrumban” is an informal label for this kind of mix, not a defined framework.</li>
</ul>`)}`,
  example: {
    title: 'Support tickets keep eating the Sprint',
    html: `
<p>Your team gets 10–15 tickets a week from partner firms: data mismatches, RTA feed issues, report questions. They land on whoever is free, people context-switch all day, feature work stalls, and tickets age without anyone noticing.</p>
<ul>
  <li><strong>Visualize:</strong> one board with Ready → Build (WIP 4) → Review (WIP 2) → Test (WIP 2) → Done.</li>
  <li><strong>A support lane:</strong> WIP 1, an SLE of 85% of P2 tickets resolved within 3 working days, and a weekly rotating “support Developer”. P1 production incidents are expedited immediately.</li>
  <li><strong>Plan for reality:</strong> support has historically taken about 20% of capacity, so Sprint Planning forecasts feature work with the remaining 80%.</li>
  <li><strong>Inspect:</strong> the Daily Scrum looks at the oldest items first (Work Item Age). The Retrospective reviews whether the WIP limits are helping.</li>
</ul>
<p>Result: feature items stop sitting half-finished for a whole Sprint, and partners get a predictable response time.</p>`
  },
  mistakes: [
    'Thinking Kanban just means “a board with columns”, without WIP limits or explicit policies.',
    'Setting WIP limits and ignoring them as soon as things get busy.',
    'Switching from Scrum to Kanban to escape Sprint Goals and discipline rather than for real flow reasons.',
    'Letting support work silently consume Sprint capacity instead of making it visible.',
    'Optimizing for utilization (everyone busy) instead of flow (items finished).'
  ],
  tryit: {
    prompt: `<p><strong>Part 1:</strong> which flow metric is each statement about?</p>
<p><strong>Part 2 (box below):</strong> your board has Ready, Build, Review, Test and Done. The team is 5 developers and 1 QA engineer, with 10–15 support tickets a week. Propose WIP limits and a policy for support tickets.</p>`,
    placeholder: 'Build WIP: …\nReview WIP: …\nTest WIP: …\nSupport policy: …',
    classify: {
      buckets: ['WIP', 'Throughput', 'Work Item Age', 'Cycle Time'],
      items: [
        ['KYC-212 has been in progress for 9 days.', 2, 'The age of an item that is still in progress.'],
        ['We finished 14 items last week.', 1, 'Completions per unit of time.'],
        ['There are 11 items started but not finished.', 0, 'A count of work in progress.'],
        ['Finished items took a median of 4 days from start to done.', 3, 'Elapsed time for completed items.']
      ]
    },
    model: `<p><strong>Part 1:</strong> Work Item Age · Throughput · WIP · Cycle Time.</p>
<p><strong>Part 2:</strong> Build WIP 4 (fewer than the 5 developers, which encourages pairing and swarming). Review WIP 2. Test WIP 2, because QA is the likely bottleneck and developers should help test when it’s full. A support lane with WIP 1 and an SLE (85% of P2 tickets within 3 working days), a weekly rotating support Developer, and P1 incidents expedited. Forecast Sprint work with about 80% of throughput to leave room for support. The policy in one line: <strong>stop starting, start finishing</strong>.</p>`
  },
  quiz: [
    { q: 'Average WIP is 12 items and throughput is 6 items a week. Using Little’s Law, what’s the average cycle time?', o: [
      ['0.5 weeks', false, 'That divides throughput by WIP, which is the wrong way round.'],
      ['2 weeks', true, 'Cycle Time = WIP ÷ Throughput = 12 ÷ 6 = 2 weeks.'],
      ['6 weeks', false, 'That’s just the throughput figure.'],
      ['72 weeks', false, 'That multiplies the two instead of dividing.']
    ] },
    { q: 'What does a WIP limit mainly do?', o: [
      ['Makes developers work longer hours.', false, 'It has nothing to do with hours.'],
      ['Reduces multitasking and queues, so items finish faster and bottlenecks become visible.', true, 'Less work in progress means shorter cycle times (Little’s Law) and exposes where flow is stuck.'],
      ['Replaces the Sprint Goal.', false, 'They’re complementary. WIP limits don’t provide an objective.'],
      ['Limits the size of the Product Backlog.', false, 'WIP limits apply to work that has started, not to the backlog.']
    ] },
    { q: 'When does Kanban often fit better than Scrum’s Sprint cadence?', o: [
      ['Building a new AI product towards an uncertain goal.', false, 'This is classic complex product work, which suits Scrum well.'],
      ['A continuous, interrupt-driven stream such as partner support tickets with service-level expectations.', true, 'Continuous flow with SLEs suits this kind of work.'],
      ['Never.', false, 'Many teams use Kanban successfully, especially for operational work.'],
      ['Whenever the team dislikes meetings.', false, 'Choose based on the nature of the work, not to avoid meetings.']
    ] },
    { q: 'A Scrum Team adopts Kanban practices. Which statement is true?', o: [
      ['They have to drop Sprints.', false, 'Under the Kanban Guide for Scrum Teams, Sprints and all the other Scrum elements remain.'],
      ['They keep Scrum’s events, artifacts and accountabilities, and add flow practices (visualized workflow, WIP limits, flow metrics).', true, 'The practices complement Scrum. They don’t replace it.'],
      ['The Product Owner is no longer needed.', false, 'Adding flow practices doesn’t remove any accountability.'],
      ['The Daily Scrum becomes a weekly sync.', false, 'The Daily Scrum stays. Flow metrics just make it more useful.']
    ] }
  ]
});
</script>

<script>
/* ================= Module 5 · Glossary (cards marked card:1 feed the flashcard deck) ================= */
GLOSSARY.push(
  // ---- PM ----
  { term: 'Acceptance criteria', track: 'pm', np: 1, card: 1, lesson: 'pm-5', def: 'Pass/fail conditions a backlog item must meet to count as complete, often written as Given/When/Then. Specific to one item, unlike the Definition of Done.' },
  { term: 'Activation', track: 'pm', card: 1, lesson: 'pm-6', def: 'The moment a user first gets real value from the product, defined as a behavior. Example: an advisor generates and opens 3 briefs within 14 days.' },
  { term: 'A/B test', track: 'pm', lesson: 'pm-10', def: 'A randomized experiment that compares two variants to measure the effect of a change. Often impractical in B2B because of low volume.' },
  { term: 'APM (Associate Product Manager)', track: 'pm', card: 1, lesson: 'pm-1', def: 'An entry-level PM who usually owns a slice of the product (a feature area or workflow) under a more senior product leader.' },
  { term: 'ARR (Annual Recurring Revenue)', track: 'pm', lesson: 'pm-6', def: 'The annualized value of recurring subscription contracts. The core revenue measure for B2B SaaS.' },
  { term: 'Assumption mapping', track: 'pm', lesson: 'pm-3', def: 'Listing the assumptions behind an idea and ranking them by importance and lack of evidence, so the riskiest get tested first.' },
  { term: 'Churn (logo vs revenue)', track: 'pm', card: 1, lesson: 'pm-6', def: 'Customers who leave. Logo churn counts the accounts lost. Revenue churn counts the ARR lost. One large firm leaving can matter more than five small ones.' },
  { term: 'Cohort', track: 'pm', lesson: 'pm-6', def: 'A group of users who share a starting period, such as advisors activated in March. Retention is analyzed by cohort.' },
  { term: 'Concierge test', track: 'pm', lesson: 'pm-3', def: 'Delivering a service manually to a few customers to learn what they value before automating anything.' },
  { term: 'Cost of delay', track: 'pm', lesson: 'pm-4', def: 'The value lost by delivering something later. Useful when deadlines, deals or regulatory dates are involved.' },
  { term: 'Deploy vs release', track: 'pm', card: 1, lesson: 'pm-10', def: 'Deploying puts code into production. Releasing makes it available to users. Feature flags let you do the two separately.' },
  { term: 'Discovery', track: 'pm', card: 1, lesson: 'pm-3', def: 'Work to decide whether something is worth building and in what shape, by testing value, usability, feasibility and viability.' },
  { term: 'Delivery', track: 'pm', lesson: 'pm-3', def: 'Building, testing and releasing production-quality software reliably.' },
  { term: 'Dual-track agile', track: 'pm', card: 1, lesson: 'pm-3', def: 'Running discovery and delivery continuously and in parallel, with validated ideas feeding delivery and usage data feeding discovery.' },
  { term: 'Edge case', track: 'pm', lesson: 'pm-5', def: 'An unusual condition such as empty data, stale data, huge volumes, missing permissions or an AI failure. In B2B, edge cases are where trust is won or lost.' },
  { term: 'Fake door test', track: 'pm', card: 1, lesson: 'pm-3', def: 'An entry point for a feature that doesn’t exist yet, used to measure demand. Users who click are told honestly that it’s coming.' },
  { term: 'Feature flag', track: 'pm', card: 1, lesson: 'pm-10', def: 'A switch that controls who can see a feature without redeploying. Used for gradual rollouts, kill switches, per-firm entitlements and experiments.' },
  { term: 'Four product risks', track: 'pm', card: 1, lesson: 'pm-3', def: 'Value (will they use it?), usability (can they use it?), feasibility (can we build it?), viability (does it work for the business, including compliance?).' },
  { term: 'Funnel', track: 'pm', card: 1, lesson: 'pm-6', def: 'A sequence of steps with a conversion rate at each, such as invited → logged in → first brief → activated. It shows where users drop off.' },
  { term: 'Golden set', track: 'pm', card: 1, lesson: 'pm-5', def: 'A curated set of real (masked) example inputs with known good outputs, used as an acceptance test for AI prompts and models.' },
  { term: 'Guardrail metric', track: 'pm', card: 1, lesson: 'pm-6', def: 'A metric that must not get worse while you improve the success metric, such as compliance flags, latency, cost or error reports.' },
  { term: 'Hallucination', track: 'pm', card: 1, lesson: 'pm-5', def: 'AI output that sounds plausible but is false, such as a wrong XIRR figure. Mitigate by computing numbers outside the model and checking against a golden set.' },
  { term: 'Holdout group', track: 'pm', lesson: 'pm-10', def: 'Users or firms deliberately left without a feature for a while, so its impact can be measured against them.' },
  { term: 'Impact/effort matrix', track: 'pm', lesson: 'pm-4', def: 'A 2×2 that sorts ideas into quick wins, big bets, fill-ins and money pits. Fast, but vague about impact and optimistic about effort.' },
  { term: 'Input metric', track: 'pm', card: 1, lesson: 'pm-6', def: 'A driver the team can move directly, such as activation or briefs per advisor, which in turn moves output metrics like revenue.' },
  { term: 'Output metric', track: 'pm', lesson: 'pm-6', def: 'A result that many teams and factors influence, such as ARR, NRR or AUM. It moves slowly.' },
  { term: 'INVEST', track: 'pm', card: 1, lesson: 'pm-5', def: 'A checklist for good backlog items: Independent, Negotiable, Valuable, Estimable, Small, Testable.' },
  { term: 'Iron triangle', track: 'pm', lesson: 'pm-7', def: 'The trade-off between scope, time and resources. When time and the team are fixed, scope flexes. Quality should not.' },
  { term: 'Jobs-to-be-Done (JTBD)', track: 'pm', card: 1, lesson: 'pm-2', def: 'The idea that people “hire” products to make progress in a situation: “When [situation], I want to [motivation], so I can [outcome].”' },
  { term: 'Kano model', track: 'pm', card: 1, lesson: 'pm-4', def: 'Classifies features as basic (expected), performance (more is better) or delighters (unexpected and loved). Delighters decay into basics over time.' },
  { term: 'Kill switch', track: 'pm', lesson: 'pm-10', def: 'A flag that instantly disables a feature in production if it misbehaves. Essential for AI features that write client-facing text.' },
  { term: 'Lagging indicator', track: 'pm', card: 1, lesson: 'pm-6', def: 'A metric that confirms results after the fact, such as renewals, churn or NRR.' },
  { term: 'Leading indicator', track: 'pm', card: 1, lesson: 'pm-6', def: 'A metric that predicts future results, such as early activation, weekly active ratio or time-to-value.' },
  { term: 'MoSCoW', track: 'pm', card: 1, lesson: 'pm-4', def: 'Must, Should, Could, Won’t (this time). Best for scoping a fixed-date release.' },
  { term: 'MVP (Minimum Viable Product)', track: 'pm', card: 1, lesson: 'pm-3', def: 'The smallest product or experiment that lets you learn whether an idea delivers value. It isn’t a low-quality version 1.' },
  { term: 'Non-goals', track: 'pm', card: 1, lesson: 'pm-5', def: 'What a spec explicitly leaves out of scope, such as “no investment recommendations in v1”. Non-goals prevent scope creep.' },
  { term: 'North Star metric', track: 'pm', card: 1, lesson: 'pm-6', def: 'The one metric that best captures the value customers get and predicts long-term success. Example: client reviews prepared with the brief per week.' },
  { term: 'NRR (Net Revenue Retention)', track: 'pm', card: 1, lesson: 'pm-6', def: '(Starting ARR + expansion − contraction − churn) ÷ starting ARR. Above 100% means existing customers are growing.' },
  { term: 'Now / Next / Later', track: 'pm', card: 1, lesson: 'pm-9', def: 'A roadmap format of columns instead of dates. Confidence and detail fall from Now to Later.' },
  { term: 'Outcome-based roadmap', track: 'pm', card: 1, lesson: 'pm-9', def: 'A roadmap built around problems to solve and metrics to move, with features shown as bets that can change.' },
  { term: 'p95 latency', track: 'pm', lesson: 'pm-5', def: 'The response time that 95% of requests come in under. A more honest performance target than the average.' },
  { term: 'Power/interest grid', track: 'pm', lesson: 'pm-8', def: 'A stakeholder map. Manage high-power, high-interest people closely, keep high-power people satisfied, and keep high-interest people informed.' },
  { term: 'PRD', track: 'pm', aka: 'product requirements document', card: 1, lesson: 'pm-5', def: 'Product requirements document: problem, goals, non-goals, scenarios, requirements, edge cases, constraints, open questions and rollout plan.' },
  { term: 'Problem statement', track: 'pm', card: 1, lesson: 'pm-2', def: '“[Segment] needs a way to [job] because [insight]. Today they [workaround], which costs [impact]. Solved when [measurable outcome].” It names no solution.' },
  { term: 'Product Manager', track: 'pm', lesson: 'pm-1', def: 'Accountable for product outcomes: which problems to solve, for whom, and how success is measured. Owns the why and the what.' },
  { term: 'Product trio', track: 'pm', card: 1, lesson: 'pm-1', def: 'A PM, a design lead and a tech lead doing discovery together, so value, usability and feasibility are considered at the same time.' },
  { term: 'RACI', track: 'pm', card: 1, lesson: 'pm-8', def: 'Responsible (does the work), Accountable (one person makes the final call), Consulted (input before), Informed (told after).' },
  { term: 'Retention', track: 'pm', card: 1, lesson: 'pm-6', def: 'The share of a cohort still active after N weeks. A healthy retention curve flattens instead of falling to zero.' },
  { term: 'RICE', track: 'pm', card: 1, lesson: 'pm-4', def: '(Reach × Impact × Confidence) ÷ Effort. Useful for ranking a backlog, but misleading when B2B value is concentrated in one deal or deadline.' },
  { term: 'Seat activation rate', track: 'pm', lesson: 'pm-6', def: 'The share of licensed seats whose users reached activation. Unused paid seats are a renewal risk.' },
  { term: 'Staged rollout', track: 'pm', card: 1, lesson: 'pm-10', def: 'Widening access step by step (internal → pilot firms → a percentage of firms → everyone), with exit criteria at each step.' },
  { term: 'Stakeholder', track: 'pm', lesson: 'pm-8', def: 'Anyone with an interest in or influence over the product: leadership, sales, operations, compliance, partner firms.' },
  { term: 'Technical debt', track: 'pm', card: 1, lesson: 'pm-7', def: 'The future cost of shortcuts or outdated design. It slows future work and causes incidents. Make it visible and frame it by business impact.' },
  { term: 'Time-to-value', track: 'pm', card: 1, lesson: 'pm-6', def: 'How long a new customer takes to get its first real outcome, such as days from contract signature to the firm’s first AI brief.' },
  { term: 'User story', track: 'pm', np: 1, card: 1, lesson: 'pm-5', def: '“As a [user], I want [capability], so that [benefit].” A placeholder for a conversation. Common with Scrum, but not part of the Scrum Guide.' },
  { term: 'Vanity metric', track: 'pm', card: 1, lesson: 'pm-6', def: 'A number that looks good but doesn’t guide decisions, such as total sign-ups or page views.' },
  { term: 'Wizard of Oz test', track: 'pm', card: 1, lesson: 'pm-3', def: 'Users interact with what looks like a working system while humans produce the output behind the scenes. It tests value before you build the technology.' },
  // ---- Scrum (official Scrum Guide terms) ----
  { term: 'Scrum', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-1', def: 'A lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems. Defined by the Scrum Guide (November 2020).' },
  { term: 'Empiricism', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-1', def: 'The idea that knowledge comes from experience and that decisions should be based on what is observed. Scrum’s foundation, together with lean thinking.' },
  { term: 'Lean thinking', track: 'scrum', sg: 1, lesson: 'scrum-1', def: 'Reducing waste and focusing on the essentials. Named in the Scrum Guide alongside empiricism.' },
  { term: 'Transparency', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-1', def: 'A pillar of empiricism. The work and the process are visible to those doing it and those receiving it. It enables inspection.' },
  { term: 'Inspection', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-1', def: 'A pillar of empiricism. Artifacts and progress are inspected frequently to detect problems. It enables adaptation.' },
  { term: 'Adaptation', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-1', def: 'A pillar of empiricism. Adjusting as soon as possible when something deviates outside acceptable limits.' },
  { term: 'Scrum Values', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-1', def: 'Commitment, Focus, Openness, Respect and Courage.' },
  { term: 'Scrum Team', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-2', def: 'One Scrum Master, one Product Owner and Developers, typically 10 or fewer people, with no sub-teams or hierarchies. Cross-functional and self-managing.' },
  { term: 'Accountability', track: 'scrum', sg: 1, lesson: 'scrum-2', def: 'The 2020 Scrum Guide’s word for Product Owner, Scrum Master and Developers. It replaced “roles”.' },
  { term: 'Product Owner', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-2', def: 'Accountable for maximizing the value of the product and for effective Product Backlog management. One person, not a committee.' },
  { term: 'Scrum Master', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-2', def: 'Accountable for establishing Scrum as defined in the Guide and for the Scrum Team’s effectiveness. “True leaders who serve” the team and the organization.' },
  { term: 'Developers', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-2', def: 'The people in the Scrum Team committed to creating any aspect of a usable Increment each Sprint. Includes designers and QA, not only coders.' },
  { term: 'Self-managing', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-2', def: 'The Scrum Team decides internally who does what, when and how. The 2020 Guide uses this term instead of “self-organizing”.' },
  { term: 'Cross-functional', track: 'scrum', sg: 1, lesson: 'scrum-2', def: 'The team has all the skills needed to create value each Sprint.' },
  { term: 'Impediment', track: 'scrum', sg: 1, lesson: 'scrum-2', def: 'Anything blocking the Scrum Team’s progress. The Scrum Master causes impediments to be removed.' },
  { term: 'Product Backlog', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-3', def: 'An emergent, ordered list of what is needed to improve the product. The single source of work for the Scrum Team. Its commitment is the Product Goal.' },
  { term: 'Product Goal', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-3', def: 'A future state of the product the team plans against, and the Scrum Team’s long-term objective. It must be fulfilled or abandoned before taking on the next one.' },
  { term: 'Sprint Backlog', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-3', def: 'The Sprint Goal (why), the selected Product Backlog items (what) and an actionable plan (how). A plan by and for the Developers.' },
  { term: 'Sprint Goal', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-3', def: 'The single objective for the Sprint. A commitment by the Developers that leaves flexibility in the exact work needed. Created during Sprint Planning.' },
  { term: 'Increment', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-3', def: 'A concrete, usable stepping stone towards the Product Goal, additive to prior Increments. Several can be created in a Sprint, and they may be delivered before it ends.' },
  { term: 'Definition of Done', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-3', def: 'A formal description of the state of the Increment when it meets the required quality measures. Work that doesn’t meet it can’t be released or presented at the Sprint Review.' },
  { term: 'Commitments', track: 'scrum', sg: 1, lesson: 'scrum-3', def: 'The focus each artifact carries: Product Goal (Product Backlog), Sprint Goal (Sprint Backlog), Definition of Done (Increment).' },
  { term: 'Sprint', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-4', def: 'A fixed-length event of one month or less that contains all the other events. The next one starts immediately after the previous one ends.' },
  { term: 'Sprint Planning', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-4', def: 'Starts the Sprint. The whole Scrum Team covers why the Sprint is valuable, what can be Done and how. Max 8 hours for a one-month Sprint.' },
  { term: 'Daily Scrum', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-4', def: 'A 15-minute event for the Developers to inspect progress towards the Sprint Goal and adapt the Sprint Backlog. Held every working day.' },
  { term: 'Sprint Review', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-4', def: 'The Scrum Team and key stakeholders inspect the Sprint’s outcome and decide what to do next. A working session, not just a presentation. Max 4 hours for a one-month Sprint.' },
  { term: 'Sprint Retrospective', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-4', def: 'The Scrum Team plans ways to increase quality and effectiveness, including changes to the Definition of Done. It concludes the Sprint. Max 3 hours for a one-month Sprint.' },
  { term: 'Timebox', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-4', def: 'A maximum duration for an event. Scrum’s events are timeboxed, and shorter Sprints usually have shorter events.' },
  { term: 'Sprint cancellation', track: 'scrum', sg: 1, lesson: 'scrum-4', def: 'A Sprint can be cancelled if its Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel it.' },
  { term: 'Product Backlog refinement', track: 'scrum', sg: 1, card: 1, lesson: 'scrum-5', def: 'An ongoing activity, not an event, of breaking down and adding detail (description, order, size) to Product Backlog items.' },
  // ---- Scrum-adjacent practices NOT in the Scrum Guide ----
  { term: 'Story points', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'Relative size estimates (often 1, 2, 3, 5, 8, 13) combining effort, complexity and uncertainty. Specific to each team and not convertible to hours.' },
  { term: 'Velocity', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'Story points completed per Sprint, used by a team to forecast. It stops being useful as soon as it becomes a target.' },
  { term: 'Definition of Ready', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'A team checklist an item should meet before Sprint Planning. Can become a stage gate if applied rigidly.' },
  { term: 'Burndown chart', track: 'scrum', np: 1, lesson: 'scrum-5', def: 'A chart of remaining work over time. The Guide mentions burn-downs only as one forecasting practice that doesn’t replace empiricism.' },
  { term: 'Planning Poker', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'A consensus estimation technique where everyone reveals an estimate at the same time, to avoid anchoring.' },
  { term: 'Backlog grooming', track: 'scrum', np: 1, lesson: 'scrum-5', def: 'An older name for Product Backlog refinement. The Scrum Guide uses “refinement”.' },
  { term: 'Standup', track: 'scrum', np: 1, lesson: 'scrum-4', def: 'An informal name for the Daily Scrum. Standing up isn’t required.' },
  { term: 'Epic', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'A large backlog item that needs splitting into smaller items before it can be Done within a Sprint.' },
  { term: 'Spike', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'A timeboxed research item that reduces uncertainty, such as measuring model accuracy on 200 sample documents.' },
  { term: 'Vertical slice', track: 'scrum', np: 1, card: 1, lesson: 'scrum-5', def: 'A thin piece of functionality that works end to end and delivers usable value, as opposed to a horizontal slice of one technical layer.' },
  { term: 'Proxy Product Owner', track: 'scrum', np: 1, lesson: 'scrum-2', def: 'An anti-pattern: someone with the PO title but no real decision rights, so every decision gets escalated.' },
  { term: 'Hardening Sprint', track: 'scrum', np: 1, lesson: 'scrum-6', def: 'An anti-pattern: a Sprint set aside for stabilizing “done” work. A sign the Definition of Done is too weak.' },
  { term: 'Scrumban', track: 'scrum', np: 1, lesson: 'scrum-7', def: 'An informal label for mixing Scrum with Kanban practices. Not a defined framework.' },
  // ---- Agile / Kanban ----
  { term: 'Agile Manifesto', track: 'scrum', card: 1, lesson: 'scrum-1', def: 'The 2001 statement of four values (individuals and interactions, working software, customer collaboration, responding to change) and twelve principles.' },
  { term: 'Waterfall', track: 'scrum', card: 1, lesson: 'scrum-1', def: 'A plan-driven approach with sequential phases. It works for stable, well-understood work, and learns late on complex work.' },
  { term: 'Kanban', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'A strategy for optimizing flow: define and visualize the workflow, actively manage items in it, and improve it. Uses WIP limits and flow metrics.' },
  { term: 'WIP limit', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'A cap on how many items can be in a workflow state at once. It reduces multitasking and exposes bottlenecks.' },
  { term: 'Work in progress (WIP)', track: 'scrum', lesson: 'scrum-7', def: 'Items that have started but aren’t finished.' },
  { term: 'Throughput', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'The number of items finished per unit of time.' },
  { term: 'Cycle time', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'The elapsed time from when an item starts to when it finishes.' },
  { term: 'Work Item Age', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'How long an in-progress item has been in progress. The best early warning that something is stuck.' },
  { term: 'Little’s Law', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'Average cycle time = average WIP ÷ average throughput. Less WIP means faster delivery.' },
  { term: 'Service Level Expectation (SLE)', track: 'scrum', card: 1, lesson: 'scrum-7', def: 'A forecast of how long items should take, such as “85% of support tickets resolved within 3 working days”.' }
);

/* ================= Module 6 · Sprint simulator ================= */
SIM.title = 'Sprint simulator';
SIM.intro = `<p>You’re the APM, and your CTO, Vikram, has made you <strong>Product Owner</strong> for the AI meeting-prep brief. The Scrum Team: Arjun (tech lead, acting as Scrum Master), four engineers, Meera (designer) and a QA engineer. Sprints are <strong>two weeks (10 working days)</strong>.</p>
<p><strong>Product Goal:</strong> “Advisors can prepare any client review in under 15 minutes using an AI brief they trust.” Make eight decisions. Each one moves three gauges, and you get feedback with a reference to the Scrum Guide.</p>`;
SIM.ratings = [
  { min: 85, title: 'Scrum-fluent Sprint', text: 'You protected the Sprint Goal, kept stakeholders close without letting them steer the Sprint, and kept “Done” honest. This is what a healthy PO looks like.' },
  { min: 60, title: 'Solid, with a few bruises', text: 'Most calls were sound. Check the decisions where a stronger option existed: they’re usually about who decides what, and about transparency.' },
  { min: 30, title: 'A bumpy Sprint', text: 'Several decisions traded long-term health for short-term comfort. Revisit the linked lessons on events, commitments and anti-patterns, then run it again.' },
  { min: 0, title: 'The Sprint got away from you', text: 'That’s fine, it’s why simulators exist. Start with Scrum lessons 3, 4 and 6, then try again.' }
];
SIM.steps = [
  { day: 1, phase: 'Sprint Planning', lesson: 'scrum-3', title: 'Choose the Sprint Goal',
    scene: `<p>Sprint 14 starts. You arrive at Sprint Planning with the refined top of the Product Backlog: the “what changed since last meeting” calculation, XIRR display, a failed-SIP section, the brief generation endpoint, PDF export, Hindi summaries and a client-sharing flow.</p><p>The team asks you to propose why this Sprint matters. Which Sprint Goal do you put forward?</p>`,
    options: [
      { t: '“Finish BRF-21, BRF-24, BRF-27, BRF-29 and the open bugs.”', s: 2, fx: { goal: -5 }, fb: 'This is a ticket list, not an objective. It doesn’t explain why the Sprint is valuable, and it leaves no room to renegotiate scope when something turns out harder than expected.', ref: 'Scrum Guide: “The Sprint Goal is the single objective for the Sprint.”' },
      { t: '“Pilot advisors can generate an accurate ‘what changed since our last meeting’ brief for mutual fund clients.”', s: 10, fx: { goal: 15, team: 5, trust: 5 }, fb: 'One clear objective that ties to the Product Goal, explains the value, and lets the Developers flex the exact work. Everyone can tell on day 10 whether it was achieved.', ref: 'Scrum Guide: the Sprint Goal is a commitment by the Developers, but “it provides flexibility in terms of the exact work needed to achieve it.”' },
      { t: '“Ship the full brief, PDF export, Hindi summaries and client sharing.”', s: 0, fx: { goal: -15, team: -10, trust: 5 }, fb: 'Four objectives in one Sprint means no focus. It pleases stakeholders today and disappoints them on day 10. A Sprint Goal is a single objective.', ref: 'Scrum Guide: “The Sprint Goal is the single objective for the Sprint.”' },
      { t: 'Let the Developers pick whatever they like and write a goal at the end.', s: 0, fx: { goal: -10, team: -5 }, fb: 'The PO proposes how the product could increase its value, and the whole Scrum Team crafts the goal together. It has to exist before the work starts, or the Daily Scrum has nothing to inspect.', ref: 'Scrum Guide: “The Sprint Goal must be finalized prior to the end of Sprint Planning.”' }
    ] },
  { day: 1, phase: 'Sprint Planning', lesson: 'scrum-4', title: 'The forecast is bigger than the team',
    scene: `<p>The items that best serve the goal add up to <strong>45 points</strong>. The team completed 28, 31, 30 and 33 points in its last four Sprints. Vikram has dropped into Planning:</p>
<div class="who"><span class="av">VK</span><div><b>Vikram · CTO</b>“Let’s stretch this time. The pilot firms are waiting.”</div></div><p>What do you do?</p>`,
    options: [
      { t: 'Take all 45 points and ask the team to put in extra hours.', s: 0, fx: { goal: -15, team: -15, trust: 5 }, fb: 'Overloading a Sprint almost guarantees a missed goal, cut corners and a tired team. Stakeholders are happy until day 10.', ref: 'Scrum Guide: the more the Developers know about their past performance, upcoming capacity and Definition of Done, the more confident their forecasts will be.' },
      { t: 'The Developers select what they can get Done (about 30 points) that best serves the goal. The rest stays ordered in the backlog, and you tell Vikram what’s in and what comes next.', s: 10, fx: { goal: 10, team: 10, trust: 5 }, fb: 'The Developers own the forecast, the goal stays achievable, and Vikram gets a transparent picture of what’s coming. Saying “not this Sprint” with a reason builds more trust than over-promising.', ref: 'Scrum Guide: “Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint.”' },
      { t: 'Take 45 points but quietly skip the golden-set regression to go faster.', s: 0, fx: { goal: -5, team: -5, trust: -10 }, fb: 'Lowering quality in secret is the most expensive shortcut there is, especially with client numbers in an AI brief.', ref: 'Scrum Guide: during the Sprint, “quality does not decrease.”' },
      { t: 'Pick 30 points yourself and assign tasks to each engineer.', s: 4, fx: { goal: 5, team: -10 }, fb: 'Right amount, wrong owner. Choosing how much to take on and planning how to do it are the Developers’ job. Assigning tasks undermines self-management.', ref: 'Scrum Guide: the Sprint Backlog “is a plan by and for the Developers.”' }
    ] },
  { day: 3, phase: 'Daily Scrum', lesson: 'scrum-6', title: 'The CTO turns the Daily Scrum into a status meeting',
    scene: `<p>Vikram joins the Daily Scrum and asks each engineer, one by one, what they did yesterday. It runs 25 minutes. Nobody mentions the Sprint Goal. Afterwards Arjun looks at you.</p>`,
    options: [
      { t: 'Join in. It’s useful for you to hear status too.', s: 0, fx: { team: -10, goal: -5, trust: 5 }, fb: 'This reinforces the anti-pattern. The Developers stop planning together and start performing for management.', ref: 'Scrum Guide: “The Daily Scrum is a 15-minute event for the Developers of the Scrum Team.”' },
      { t: 'Afterwards, talk to Vikram privately. Explain the event’s purpose, offer the board link and a 10-minute weekly sync with you, and ask Arjun to coach the format.', s: 10, fx: { team: 10, goal: 5, trust: 5 }, fb: 'You get Vikram the visibility they want another way, and you restore the event’s purpose. The Scrum Master helps stakeholders understand an empirical approach and removes barriers.', ref: 'Scrum Guide: the Scrum Master serves the organization by “removing barriers between stakeholders and Scrum Teams.”' },
      { t: 'Tell Vikram, in front of everyone, to leave the meeting.', s: 3, fx: { team: 5, trust: -15 }, fb: 'Right principle, damaging delivery. A private conversation and the Scrum Master’s coaching get the same result without embarrassing your manager.', ref: 'Scrum Values: Respect and Courage go together.' },
      { t: 'Cancel Daily Scrums this Sprint and switch to Slack updates.', s: 0, fx: { goal: -10, team: -5 }, fb: 'Removing the team’s daily inspect-and-adapt point to dodge an awkward conversation makes things worse.', ref: 'Scrum Guide: Daily Scrums “improve communications, identify impediments, promote quick decision-making.”' }
    ] },
  { day: 4, phase: 'Mid-Sprint', lesson: 'scrum-3', title: 'Compliance raises a blocker',
    scene: `<div class="who"><span class="av">FA</span><div><b>Farah · Compliance</b>“Before pilot advisors see AI-written text, it needs our approved disclaimer and an audit log of the prompt, model version and inputs.”</div></div><p>The team didn’t plan for the audit log. It’s about 5 points of work.</p>`,
    options: [
      { t: 'Ignore it for now. The pilot advisors are friendly, so add it later.', s: 0, fx: { trust: -15, goal: -5 }, fb: 'A viability risk in a regulated business. An Increment that compliance can’t approve isn’t usable, and you’d be burning trust with the person whose sign-off you need.', ref: 'Lesson: viability and compliance belong in discovery and in the Definition of Done.' },
      { t: 'With Farah and the Developers, treat it as required for a usable Increment (and add it to the DoD from now on). Move a lower-value item, like the “top gainers” chart, back to the Product Backlog to make room, and keep the Sprint Goal intact.', s: 10, fx: { goal: 5, team: 5, trust: 10 }, fb: 'This is renegotiating scope with the PO as you learn, which Scrum expects. The goal survives, quality goes up, and compliance becomes a partner.', ref: 'Scrum Guide: Developers “collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal.”' },
      { t: 'Ask the team to absorb it by working the weekend.', s: 2, fx: { team: -15, goal: 5, trust: 5 }, fb: 'It might work once, but it hides the real trade-off and burns the team. Renegotiate scope instead.', ref: 'Scrum Guide: “Scope may be clarified and renegotiated with the Product Owner as more is learned.”' },
      { t: 'Cancel the Sprint, because the plan changed.', s: 0, fx: { goal: -15, trust: -5 }, fb: 'The Sprint Goal is still valid, so cancelling is wasteful. Plans are expected to change inside a Sprint.', ref: 'Scrum Guide: a Sprint could be cancelled “if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.”' }
    ] },
  { day: 6, phase: 'Mid-Sprint', lesson: 'scrum-6', title: 'Sales asks for a demo feature mid-Sprint',
    scene: `<div class="who"><span class="av">KB</span><div><b>Kabir · Head of Sales</b>“A prospect with ₹500 Cr AUM is seeing a demo on Monday. I need a custom PDF report with their logo and a ‘model portfolio comparison’ page. Can the team add it this Sprint? It’s maybe two days.”</div></div><p>Kabir has also messaged one of the engineers directly.</p>`,
    options: [
      { t: 'Say yes and ask an engineer to start right away. It’s revenue.', s: 0, fx: { goal: -20, team: -10, trust: 10 }, fb: 'This endangers the Sprint Goal and bypasses the team’s plan. It also teaches Sales that messaging engineers directly works.', ref: 'Scrum Guide: during the Sprint, “no changes are made that would endanger the Sprint Goal.”' },
      { t: 'Flat no: “The Sprint is locked. Put it in Jira.”', s: 3, fx: { goal: 5, trust: -15 }, fb: 'It protects the goal but damages the relationship and ignores a real business need. Scrum gives you room to find out what Kabir needs and offer an option.', ref: 'Scrum Values: Openness and Respect.' },
      { t: 'Find out what the demo really needs. With the Developers, check what fits without endangering the goal (for example, demoing the brief on a masked sample client). Put the comparison page in the Product Backlog in order, and tell Kabir what they get and when.', s: 10, fx: { goal: 5, trust: 10, team: 5 }, fb: 'You act as the single point of intake, protect the Sprint Goal, and still serve the business. The comparison page competes on value in the backlog instead of jumping the queue. You also ask Kabir to come to you instead of the engineers.', ref: 'Scrum Guide: “Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.”' },
      { t: 'Cancel the Sprint and replan around the demo.', s: 0, fx: { goal: -20, team: -10, trust: 5 }, fb: 'One demo request doesn’t make the Sprint Goal obsolete. Cancelling throws away work in progress and destroys focus.', ref: 'Scrum Guide: cancellation only when “the Sprint Goal becomes obsolete.”' }
    ] },
  { day: 9, phase: 'Mid-Sprint', lesson: 'scrum-3', title: 'A story isn’t meeting the Definition of Done',
    scene: `<p>BRF-27, the failed-SIP section, is code-complete and looks great. But the golden-set regression found <strong>2 numeric mismatches</strong> in 50 portfolios, so it doesn’t meet the Definition of Done. The Sprint Review is tomorrow.</p>`,
    options: [
      { t: 'Show it as done at the review. Stakeholders will love it, and you’ll fix it next Sprint.', s: 0, fx: { trust: -10, goal: -5 }, fb: 'This breaks transparency. Stakeholders make decisions based on a false picture, and the team learns that “Done” is negotiable.', ref: 'Scrum Guide: work not meeting the DoD “cannot be released or even presented at the Sprint Review.”' },
      { t: 'Be transparent. It isn’t Done, so it isn’t part of the Increment or demoed as such. It returns to the Product Backlog, probably at the top for next Sprint, and you say plainly at the review that it didn’t make it.', s: 10, fx: { trust: 5, team: 5 }, fb: 'Honest and calm. The DoD exists so that “Done” means usable, which matters even more when the output is client numbers.', ref: 'Scrum Guide: “Instead, it returns to the Product Backlog for future consideration.”' },
      { t: 'Relax the DoD for this item. 48 out of 50 correct is 96% accurate.', s: 0, fx: { trust: -10, team: -5, goal: -5 }, fb: 'Two wrong numbers in a client brief is two potential complaints. Lowering the bar mid-Sprint to look good is exactly what the DoD prevents.', ref: 'Scrum Guide: during the Sprint, “quality does not decrease.”' },
      { t: 'Ask a developer to stay late and hard-code fixes for those two test cases.', s: 2, fx: { team: -10, goal: 5 }, fb: 'Making the test pass without fixing the root cause games the DoD and leaves the bug in production.', ref: 'Scrum Guide: Developers instil quality “by adhering to a Definition of Done.”' }
    ] },
  { day: 10, phase: 'Sprint Review', lesson: 'scrum-4', title: 'How do you run the Sprint Review?',
    scene: `<p>The Increment works for mutual fund clients: an accurate what-changed brief, with the disclaimer and audit log. Two pilot advisors, Farah, Kabir and Vikram are free this afternoon.</p>`,
    options: [
      { t: 'Present a 20-slide deck summarizing tickets closed and velocity.', s: 0, fx: { trust: -5 }, fb: 'This is demo theater. A deck about output gives stakeholders nothing to inspect and no way to shape what comes next.', ref: 'Scrum Guide: the Scrum Team “should avoid limiting it to a presentation.”' },
      { t: 'Run a working session. Pilot advisors use the Increment on masked client data, you look at usage data and what changed (the compliance requirement, Kabir’s request), decide together what’s next, and adjust the Product Backlog in the room.', s: 10, fx: { trust: 15, goal: 5 }, fb: 'This is empiricism working: real product, real users, real decisions. Kabir sees the comparison page placed in the backlog for a reason, and Farah sees the audit log working.', ref: 'Scrum Guide: “Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities.”' },
      { t: 'Skip the review and send a release-notes email.', s: 0, fx: { trust: -10 }, fb: 'You lose Scrum’s main moment to inspect the product with stakeholders and adapt the plan.', ref: 'Scrum Guide: the Sprint Review’s purpose is “to inspect the outcome of the Sprint and determine future adaptations.”' },
      { t: 'Demo only to Vikram to save everyone else’s time.', s: 3, fx: { trust: -5 }, fb: 'The review is for key stakeholders. The advisors, compliance and Sales each bring information the CTO doesn’t have.', ref: 'Scrum Guide: “The Scrum Team presents the results of their work to key stakeholders.”' }
    ] },
  { day: 10, phase: 'Sprint Retrospective', lesson: 'scrum-6', title: 'The team wants to skip the retrospective',
    scene: `<p>Everyone is tired. Someone suggests skipping the retrospective because the next Sprint starts tomorrow anyway.</p>`,
    options: [
      { t: 'Skip it this once.', s: 0, fx: { team: -10 }, fb: '“This once” becomes a habit. The compliance surprise and the Daily Scrum problem would happen again next Sprint.', ref: 'Scrum Guide: the Retrospective concludes the Sprint and plans ways to increase quality and effectiveness.' },
      { t: 'Hold a short, focused retro, well inside the timebox. Discuss what went well and what didn’t (the late compliance requirement, the CTO at the Daily Scrum), pick one or two improvements, and put the top one in the next Sprint Backlog.', s: 10, fx: { team: 15, goal: 5 }, fb: 'A short retro that produces one real change beats a long one that produces a list. Adding compliance checks to the DoD and to refinement directly prevents this Sprint’s biggest surprise.', ref: 'Scrum Guide: the most impactful improvements “may even be added to the Sprint Backlog for the next Sprint.”' },

<script>

        try { window.localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* storage unavailable: keep in memory */ }

        let flag = '';
        if (answered) {
          if (o[1]) { cls += ' is-correct'; flag = oi === chosen ? 'Your answer · correct' : 'Correct answer'; }

  /* ---------- Home ---------- */
