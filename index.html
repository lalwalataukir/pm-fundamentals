LESSONS.push({
  id: 'pm-7', track: 'pm', n: 7, minutes: 12,
  title: 'Working with engineering and design', short: 'Engineering & design',
  sub: 'Estimation conversations, trade-offs, tech debt, design feedback, and how to say no.',
  idea: 'Bring problems and constraints, not solutions and deadlines. Negotiate the scope, never the estimate.',
  body: `
<p>Your relationship with engineers and designers <em>is</em> the job. Involve them early, share the why, and respect their expertise. If they only ever see finished tickets, you’ll get exactly what the tickets say and nothing better.</p>
<h3>Estimation conversations</h3>
<p>An estimate is a <strong>forecast under uncertainty</strong>, not a promise. Ask questions that reduce the uncertainty or the scope instead of haggling over the number:</p>
<ul>
  <li>“What makes this big? Which part is the riskiest?”</li>
  <li>“Is there a smaller version that delivers most of the value?”</li>
  <li>“What would we need to learn to be more confident, and could a short spike tell us?”</li>
  <li>“If the date is fixed, what would you cut first?”</li>
</ul>
<p>The classic trade-off triangle is scope, time and people. When the date and the team are fixed, <strong>scope flexes</strong>. Quality doesn’t. In regulated finance, cutting testing or the audit log to hit a date is the most expensive shortcut there is.</p>
<h3>Making trade-offs explicit</h3>
<p>Give decision-makers options instead of a single plan. Show the value, cost and risk of each one, and make a recommendation. A good decision depends on seeing those side by side.</p>
<h3>Tech debt</h3>
<p>Tech debt is the future cost of shortcuts and outdated design. It can be <em>deliberate</em> (we shipped fast on purpose), <em>accidental</em> (we found a better design later) or <em>bit rot</em> (dependencies and infrastructure aged). You should care because it slows every future feature and causes incidents, often at the worst moment, like month-end or quarter-end reporting.</p>
<ul>
  <li>Make it visible as backlog items that state their <strong>business impact</strong>, for example “NAV import retries fail at month-end: 3 partner escalations last quarter”.</li>
  <li>Many teams reserve a steady slice of capacity for it, often 15–25%. That’s a team practice, not a rule.</li>
  <li>Tie paydown to outcomes: “cuts report-generation failures from 3% to under 0.5%”.</li>
</ul>
<h3>Working with design</h3>
<p>Share the problem and the constraints before any screens exist. Give feedback anchored in <strong>user goals</strong>, not taste. “Can an advisor spot a failed SIP within 5 seconds on this screen?” is useful. “Make it pop” isn’t.</p>
<h3>Saying no</h3>
<p>Every yes is a no to something else. A good no: <strong>acknowledge</strong> the need, <strong>explain</strong> the trade-off against current priorities, and <strong>offer</strong> an alternative (“no, but…” or “yes, if…”) or a clear condition for revisiting it.</p>`,
  example: {
    title: '“Real-time portfolio sync” came back as an XL estimate',
    html: `
<p>A large partner asks, through the CTO, for “real-time portfolio values”. Engineers estimate 8–10 weeks.</p>
<p><strong>You ask what drives the size.</strong> Mutual fund NAVs are published once a day, so real-time isn’t even available at the source. Holdings data from the RTAs (CAMS, KFintech) arrives in batches. Live equity prices need a paid exchange data licence plus streaming infrastructure.</p>
<p><strong>You go back to the problem.</strong> In two partner calls, advisors say what they really want is to <em>trust</em> the numbers during a client call. They often don’t know when the data was last updated.</p>
${table(['Option', 'Effort', 'Value'], [
  ['A. Full real-time (live equity, intraday updates)', '8–10 weeks + licence cost', 'High, but only for equity-heavy HNI books'],
  ['B. End-of-day sync with an “as of” timestamp, plus on-demand refresh of equity holdings using delayed prices', '2–3 weeks', 'Solves trust for most advisors'],
  ['C. “Data as of [time]” timestamp only', '2 days', 'A quick trust win and a test of the hypothesis']
])}
<p><strong>Decision:</strong> C this Sprint, B next. Revisit A after measuring how many advisors manage equity-heavy books. You didn’t argue about whether it’s “really” 8 weeks. You changed the scope to fit the actual problem.</p>`
  },
  mistakes: [
    'Negotiating the estimate (“can’t you do it in a week?”) instead of the scope.',
    'Treating estimates as commitments, then blaming the team when uncertainty turns up.',
    'Bringing engineers solutions instead of problems, which throws away their best ideas.',
    'Treating tech debt as “engineering’s problem” until an outage hits during a partner’s quarter-end.',
    'Agreeing with the CTO in the meeting and then telling the team something different, or the other way round.',
    'Giving design feedback based on personal taste instead of user goals.'
  ],
  tryit: {
    prompt: `<p>Thursday evening, your CTO messages: <em>“Big partner demo next Wednesday. Can we add a ‘chat with your portfolio’ AI assistant? Should be quick with the LLM APIs.”</em></p>
<p>Context: the quarter goal is “cut review-prep time by 50% for pilot advisors”. The team is mid-Sprint on the meeting brief, and compliance review is pending. Draft your reply. Aim for a constructive “no, but…”.</p>`,
    placeholder: 'Hi [CTO], …',
    model: `<p>“Love the energy for the demo. Some quick context so we pick the best option. A production-safe ‘chat with your portfolio’ needs guardrails: no advice-like answers, numbers from our calculation engine, and audit logging. That makes it roughly 3–4 weeks, and it would push the meeting-brief pilot back by a month.</p>
<p>Two options for Wednesday:<br>(1) Demo the <strong>meeting brief</strong>. It’s nearly done and directly serves the quarter goal. I’ll prepare a 3-minute script with a real (masked) client.<br>(2) If the partner specifically wants chat, show a <strong>clickable prototype</strong> labeled ‘exploring’, with no live data. That’s about a day of design time.</p>
<p>I’d recommend (1) with a 30-second teaser from (2). If you’d still like to build chat properly, happy to talk through what we’d move out of the quarter.”</p>
<p><em>Why it works:</em> it acknowledges the goal, puts a number on the trade-off, offers alternatives, makes a recommendation, and explicitly leaves the final call with the CTO.</p>`
  },
  quiz: [
    { q: 'Engineers estimate a feature at 6 weeks. You hoped for 2. What’s the best response?', o: [

LESSONS.push({
  id: 'pm-8', track: 'pm', n: 8, minutes: 12,
  title: 'Stakeholders and communication', short: 'Stakeholders',
  sub: 'Status updates, managing up, and getting sales, ops and compliance aligned.',
  idea: 'No surprises. Tell the right people the right level of detail early, especially when the news is bad.',
  body: `
<h3>Map your stakeholders</h3>
<p>Internal: your CTO, sales, customer success, operations, compliance, finance and leadership. External: partner firms and their own compliance teams. A simple way to sort them is by <strong>power and interest</strong>. Manage the high-power, high-interest people closely (your CTO, a key partner). Keep high-power, lower-interest people satisfied with brief summaries (the CEO, the CFO). Keep high-interest people informed (the CS team).</p>
<h3>Managing up</h3>
<ul>
  <li>Know your CTO’s goals and worries this quarter. Frame your updates in those terms.</li>
  <li>Bring <strong>recommendations, not just problems</strong>: “Here are two options. I recommend A because…”</li>
  <li>Ask for decisions explicitly and with a date: “I need a call on A or B by Thursday.”</li>
  <li>Agree how they want to hear from you: a written weekly note, a Slack thread, a 1:1 agenda.</li>
</ul>
<h3>A weekly update that gets read</h3>
<ol>
  <li><strong>Headline</strong>: on track, at risk or off track, in one sentence.</li>
  <li><strong>Progress vs goal</strong>, using the metric.</li>
  <li><strong>Done and next.</strong></li>
  <li><strong>Risks and asks</strong>: decisions you need, and from whom.</li>
</ol>
<p>Keep exec updates under about 150 words, with links for anyone who wants more detail.</p>
<h3>Aligning sales, ops and compliance</h3>
${table(['Group', 'What they need from you', 'What to avoid'], [
  ['<strong>Sales</strong>', 'A clear roadmap story with confidence levels, one intake channel for requests, and early access to pilots', 'Letting them commit dates or features you haven’t agreed'],
  ['<strong>Ops / Customer success</strong>', 'Launch readiness: training, FAQs, support macros, notice of changes', 'Shipping changes they discover from partners'],
  ['<strong>Compliance</strong>', 'Involvement during discovery, real examples, and their requirements written as acceptance criteria', 'Arriving the week before launch for a rubber stamp']
])}
<h3>RACI</h3>
<p><strong>R</strong>esponsible (does the work), <strong>A</strong>ccountable (makes the final call, exactly one person), <strong>C</strong>onsulted (gives input before the decision), <strong>I</strong>nformed (told afterwards). Most stakeholder pain comes from people who think they’re A when they’re C.</p>
<h3>Delivering bad news</h3>
<p>Do it early, privately first, and in this order: <strong>what happened, the impact, what we’re doing about it, and what we need</strong>. Don’t sugar-coat it, and don’t wait until you’ve fixed it.</p>`,

${table(['Decision: rebalancing scope', 'Who'], [['Responsible', 'You (APM)'], ['Accountable', 'CTO'], ['Consulted', 'Compliance, sales lead, tech lead'], ['Informed', 'Customer success, leadership team']])}`

LESSONS.push({
  id: 'pm-9', track: 'pm', n: 9, minutes: 10,
  title: 'Roadmaps', short: 'Roadmaps',
  sub: 'Now / Next / Later, and why outcome-based roadmaps hold up better than feature lists.',
  idea: 'A roadmap shows which problems we’ll tackle and in what order, with confidence falling the further out you look. It’s a strategy document, not a delivery schedule.',
  body: `
<h3>What a roadmap is for</h3>
<p>A roadmap aligns people on <strong>direction and priorities</strong> and explains the trade-offs behind them. It is not a promise of dates. When it turns into one, every change becomes a broken commitment.</p>
<h3>Feature-based vs outcome-based</h3>
<p>A <strong>feature roadmap</strong> lists features with dates: “Chatbot, Q2. PDF reports, Q3.” It’s easy to read, but it commits to solutions before you’ve learned anything. An <strong>outcome roadmap</strong> lists problems to solve, each with a metric: “Cut review-prep time by 50%”. Features appear underneath as <em>bets</em>. The team is free to find the best solution, and the roadmap survives learning.</p>
<h3>Now / Next / Later</h3>
${fig(DIAG.nnl, 'Columns, not dates. Detail and confidence fall from left to right.')}
<ul>
  <li><strong>Now</strong>: committed and in progress. Well understood and high confidence.</li>
  <li><strong>Next</strong>: shaped and likely next. Medium confidence, and could change.</li>
  <li><strong>Later</strong>: problems we believe matter. Deliberately vague and low confidence.</li>
</ul>
<h3>Roadmap, backlog, release plan</h3>
${table(['Artifact', 'Horizon', 'Answers'], [
  ['Roadmap', 'Quarters', 'Which problems, in what order, and why?'],
  ['Product Goal (Scrum)', 'Months', 'What is the next objective the Scrum Team is working towards?'],
  ['Product Backlog', 'Weeks to months', 'What work, in what order?'],
  ['Sprint / release plan', 'Days to weeks', 'What ships when?']
])}
<p>Real dates do exist. Regulatory deadlines and contractual commitments should appear as <strong>explicit fixed-date items</strong>, scoped with MoSCoW so everyone knows what is negotiable.</p>
${tip('<p>Keep one roadmap with different views. Engineers need detail, executives need outcomes and metrics, and partners or sales need themes, with no dates beyond “Now”.</p>')}`,
  example: {
    title: 'Turning last year’s feature list into an outcome roadmap',
    html: `
<p><strong>The old roadmap:</strong> Q1 chatbot · Q2 PDF reports · Q2 SSO · Q3 WhatsApp alerts · Q3 Hindi UI · Q4 goal-planning module.</p>
${table(['Column', 'Outcome (metric)', 'Current bets'], [
  ['<strong>Now</strong>', 'Advisors prepare a review in under 15 minutes (median prep time)', 'AI meeting brief, PDF export of the brief'],

<p>“WhatsApp alerts” became “act on failed SIPs within 48 hours”. WhatsApp might still be the answer, but now it has to compete with simpler options.</p>`

LESSONS.push({
  id: 'pm-10', track: 'pm', n: 10, minutes: 12,
  title: 'Launches and iteration', short: 'Launches & iteration',
  sub: 'Release planning, feature flags, staged rollouts, and measuring impact honestly after launch.',
  idea: 'Launch is where learning starts. Release gradually behind flags, measure against success and guardrail metrics you set in advance, and then decide whether to roll forward, fix or roll back.',
  body: `
<h3>Deploy ≠ release</h3>
<p><strong>Deploying</strong> puts code into production. <strong>Releasing</strong> makes it available to users. <strong>Feature flags</strong> separate the two, so you can ship code safely and choose who sees it, when.</p>
<ul>
  <li><strong>Release flags</strong>: hide unfinished work and roll it out gradually.</li>
  <li><strong>Kill switches</strong>: turn a feature off instantly if it misbehaves.</li>
  <li><strong>Entitlement flags</strong>: per firm or per plan, such as “AI brief enabled for Firm X”.</li>
  <li><strong>Experiment flags</strong>: split traffic for a test.</li>
</ul>
<p>Remove flags once a rollout finishes. Stale flags are tech debt.</p>
<h3>Release planning and readiness</h3>
<p>Before you widen access, check: engineering is done (including monitoring and a rollback plan), compliance has signed off, CS is trained and has FAQs and support macros, help docs are ready, partner admins have been told, and dashboards exist for the metrics you’ll judge it by.</p>
<h3>Staged rollouts, B2B-style</h3>
${fig(DIAG.rollout, 'Widen access step by step. Each step has exit criteria you agreed before launch.')}
<p>In B2B, roll out <strong>by firm</strong>, not to a random 10% of users. Firms train their advisors together and admins need control, and having half a firm on the new flow creates confusion and support tickets.</p>
<h3>Measure impact honestly</h3>
<ul>
  <li>Define <strong>success metrics</strong> and <strong>guardrails</strong> before launch, with decision rules: “Pause the rollout if numeric-error reports exceed 0.5% of briefs.”</li>
  <li>Simple before/after comparisons are confounded by seasonality (quarter-end review season), market moves and training effects.</li>
  <li>Use a <strong>comparison group</strong>: firms not enabled yet in a staggered rollout, a holdout, or an A/B test if volume allows. B2B volumes are often small, so combine numbers with interviews.</li>
</ul>
<h3>After launch</h3>
<p>Watch closely for the first 48 hours. Triage feedback and bugs. Review at 30, 60 and 90 days and decide to <strong>iterate, scale or stop</strong>. For AI features, also sample outputs for human review, track drift, cost and latency, and version prompts and models so you can roll back.</p>`,
  example: {
    title: 'Rolling out the AI portfolio summary',
    html: `
${table(['Stage', 'Who', 'Exit criteria to widen'], [
  ['0 · Internal', 'CS team + 3 internal advisors, 1 week', 'Zero numeric errors in 100 sampled summaries; p95 latency under 10 s'],
  ['1 · Pilot', '3 design-partner firms, 2 weeks', '≥60% of eligible reviews use it; edit rate under 30%; compliance spot-check passes'],
  ['2 · 25% of firms', 'Admin opt-in, 2 weeks', 'Guardrails hold; under 2 support tickets per 100 advisors'],
  ['3 · GA', 'All firms, with a firm-level admin toggle', 'Ongoing monitoring']
])}
<p><strong>Kill switch:</strong> one flag turns off the AI narrative across the platform and falls back to the data-only summary.</p>
<p><strong>Measuring impact:</strong> Stage 2 firms get the feature weeks before the rest, so you compare the two groups over the same weeks. Illustrative result: prep time fell <strong>50 → 19 min</strong> at enabled firms and <strong>50 → 46 min</strong> at not-yet-enabled firms, a seasonal effect of about 4 minutes. The effect you can attribute to the feature is about <strong>(50−19) − (50−46) = 27 minutes</strong>, not the 31 a naive before/after comparison would claim.</p>`
  },
  mistakes: [
    'Treating “deployed” as “done” and moving on without measuring anything.',
    'A big-bang launch to every firm in the same week as quarter-end reporting.',
    'Defining success only after looking at the data.',
    'Before/after comparisons that ignore seasonality and market movements.',
    'No kill switch on an AI feature that writes client-facing text.',
    'Leaving old feature flags in the codebase forever.',
    'Forgetting the people side: CS training, admin announcements and help docs.'
  ],
  tryit: {
    prompt: '<p>“Failed-SIP alerts” are ready to roll out behind a flag. Write a <strong>launch checklist</strong>, the rollout stages, and your <strong>success and guardrail metrics</strong>.</p>',
    placeholder: 'Checklist:\n- \nStages:\nSuccess metrics:\nGuardrails:',
    model: `<p><strong>Checklist:</strong> a per-firm flag plus a global kill switch; monitoring on the RTA feed and its delays; de-duplication so one failure doesn’t send three alerts; compliance review of the alert text; CS training and an FAQ; a help article; an email to partner admins; a metrics dashboard; on-call coverage; a rollback plan.</p>
<p><strong>Stages:</strong> internal (1 week) → 3 pilot firms (2 weeks) → 30% of firms → GA, each with exit criteria.</p>
<p><strong>Success:</strong> share of failed SIPs acted on within 48 hours (target 80%); median time to action.</p>
<p><strong>Guardrails:</strong> false-positive alerts under 2%; notification opt-out rate; support tickets per 100 advisors; RTA feed latency.</p>`
  },
  quiz: [
    { q: 'What’s the difference between deploying and releasing?', o: [
      ['There’s no difference.', false, 'Treating them as one is what makes launches risky.'],
      ['Deploying puts code into production. Releasing makes it available to users. Flags let you do them separately.', true, 'Separating the two lets you ship continuously and expose features gradually.'],
      ['Releasing happens before deploying.', false, 'You can’t release code that isn’t deployed.'],
      ['Deploying is only for mobile apps.', false, 'Every kind of software is deployed.']
    ] },
    { q: 'What is a guardrail metric?', o: [
      ['The main success metric.', false, 'That’s the success metric. Guardrails sit alongside it.'],
      ['A metric that must not get worse while you improve the success metric, such as compliance flags or p95 latency.', true, 'Guardrails stop you from “winning” by breaking something else.'],
      ['A metric only engineers can see.', false, 'Guardrails should be visible to everyone making launch decisions.'],
      ['A vanity metric.', false, 'They’re the opposite: protective and decision-relevant.']

    { q: 'Review prep time dropped from 50 to 30 minutes after launch. It’s also quarter-end, and advisors are preparing faster with templates anyway. What’s the best way to estimate the real impact?', o: [
      ['Report a 20-minute improvement.', false, 'This attributes the seasonal and template effects to your feature.'],
      ['Compare against firms not yet enabled over the same period, using a holdout or a staggered rollout.', true, 'A comparison group removes effects that hit everyone, like seasonality.'],
      ['Ask the sales team.', false, 'That’s anecdote, not measurement.'],
      ['Wait a year.', false, 'Too slow, and new confounders pile up in the meantime.']
    ] },
    { q: 'Why roll B2B features out firm by firm instead of to a random 10% of advisors?', o: [
      ['Random rollouts are illegal.', false, 'They’re not illegal. They just fit B2B poorly.'],
      ['Firms train and support advisors together and admins need control, so mixed access inside a firm creates confusion and support load.', true, 'The account is the natural unit in B2B.'],
      ['It’s cheaper to code.', false, 'Cost isn’t the main reason.'],
      ['There’s no real reason.', false, 'There are strong operational reasons.']
    ] }
  ]
});

LESSONS.push({
  id: 'scrum-1', track: 'scrum', n: 1, minutes: 11,
  title: 'Agile vs Scrum vs Waterfall: empiricism and values', short: 'Agile, Scrum, Waterfall',
  sub: 'What “agile” actually means, where Scrum fits, the three pillars of empiricism and the five Scrum Values.',
  idea: 'Scrum is a lightweight framework for complex work. You make progress in short cycles and use what you observe to decide what to do next.',
  body: `
<h3>Three terms people mix up</h3>
${table(['Term', 'What it is', 'Good fit'], [
  ['<strong>Waterfall</strong> (plan-driven)', 'Sequential phases: requirements → design → build → test → release', 'Stable, well-understood work, such as implementing a file format a regulator has fully specified'],
  ['<strong>Agile</strong>', 'A set of values and principles: the <em>Manifesto for Agile Software Development</em> (2001)', 'A mindset, not a process'],
  ['<strong>Scrum</strong>', 'One specific, lightweight <em>framework</em> defined by the Scrum Guide (Schwaber &amp; Sutherland, latest edition November 2020)', 'Complex work where requirements and solutions emerge as you learn']
])}
${fig(DIAG.waterfall, 'Plan-driven work learns at the end. Empirical work learns every Sprint.')}
<p>The Agile Manifesto values <strong>individuals and interactions</strong> over processes and tools, <strong>working software</strong> over comprehensive documentation, <strong>customer collaboration</strong> over contract negotiation, and <strong>responding to change</strong> over following a plan. It doesn’t say the items on the right are worthless, only that the items on the left are valued more.</p>
${guide(`<ul>
  <li>Scrum is “a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.”</li>
  <li>The Guide is <strong>purposefully incomplete</strong>. It defines only the parts required to implement Scrum theory, and teams add their own practices on top.</li>
  <li>Scrum is founded on <strong>empiricism</strong> (knowledge comes from experience and making decisions based on what is observed) and <strong>lean thinking</strong> (reduce waste, focus on the essentials).</li>
</ul>`)}
<h3>The three pillars of empiricism</h3>
<ul>
  <li><strong>Transparency</strong>: the process and the work must be visible to those doing the work and those receiving it. In the Guide’s words, inspection without transparency is misleading and wasteful.</li>
  <li><strong>Inspection</strong>: the artifacts and progress towards agreed goals are inspected frequently and diligently, to detect problems.</li>
  <li><strong>Adaptation</strong>: if something deviates outside acceptable limits, adjust as soon as possible. Inspection without adaptation is pointless.</li>
</ul>
<h3>The five Scrum Values</h3>
<p><strong>Commitment, Focus, Openness, Respect, Courage.</strong> The team commits to its goals and to supporting each other. It focuses on the work of the Sprint. Team and stakeholders are open about the work and its challenges. Members respect each other as capable, independent people. And they have the courage to do the right thing and work on tough problems, for example telling a stakeholder that the AI brief isn’t ready for clients yet.</p>
${practice('<p>When companies say “we do Agile”, they often mean “we run two-week Sprints in Jira”. Agile is a set of values, Scrum is one framework, and Jira is a tool. You can use all three and still not be empirical if nobody changes course based on what they learn.</p>', 'In practice')}`,
  example: {
    title: 'Two projects in the same company',
    html: `
<p><strong>Project A: a regulator-specified report file.</strong> The format is published, the deadline is fixed, and there are few unknowns. A plan-driven approach works well. Even inside a Scrum team, this work will be highly predictable.</p>
<p><strong>Project B: the AI meeting-prep brief.</strong> You don’t know what advisors will find valuable, and model behavior is uncertain. Empiricism earns its keep here:</p>
<ul>
  <li><strong>Transparency:</strong> the Sprint Backlog and the pilot usage dashboard are visible to everyone, CTO included. Known model errors are logged openly, not hidden.</li>
  <li><strong>Inspection:</strong> at each Sprint Review, two pilot advisors use the latest Increment live, and the team looks at usage data together.</li>
  <li><strong>Adaptation:</strong> nobody read the “client sentiment” section, so it was dropped. Advisors kept asking about SIP status, so a SIP section went to the top of the Product Backlog.</li>
</ul>`
  },
  mistakes: [
    'Saying “we’re agile” because the team uses Jira and holds standups.',
    'Treating Scrum as a full methodology that prescribes everything. It’s deliberately incomplete.',
    'Forcing Scrum onto simple, predictable or interrupt-driven work just because it’s the company process.',
    'Inspecting without adapting: reviews and retrospectives that never change anything.',
    'Hiding bad news, which destroys transparency and makes every later inspection misleading.'
  ],
  tryit: {
    prompt: `<p><strong>Part 1:</strong> for each situation, decide whether a plan-driven approach fits, or whether it needs empiricism (Scrum).</p>
<p><strong>Part 2 (box below):</strong> at your Sprint Review the team demos, stakeholders nod, and the Product Backlog never changes. Which pillar is missing, and what would you change?</p>`,
    placeholder: 'Missing pillar: …\nWhat I would change: …',
    classify: {
      buckets: ['Plan-driven fits', 'Needs empiricism'],
      items: [
        ['Implementing a regulator-specified file format whose spec is fixed and published', 0, 'The requirements are known and stable, so a plan works.'],
        ['Building an AI assistant whose usefulness to advisors is still uncertain', 1, 'Both the value and the model behavior are uncertain. You learn by shipping small Increments and inspecting them.'],
        ['Applying a vendor’s documented, routine security patch across three services', 0, 'It’s simple, known work. A checklist beats a Sprint here.'],
        ['Redesigning onboarding to cut drop-off when nobody knows the real cause', 1, 'Cause and solution have to be discovered, which makes it complex.'],
        ['Pricing and packaging AI features for partner firms', 1, 'Market response is uncertain, so experiment and adapt.']
      ]
    },
    model: `<p><strong>Part 1:</strong> plan-driven for the file format and the security patch. Empirical for the AI assistant, the onboarding redesign and the pricing work.</p>
<p><strong>Part 2:</strong> <strong>adaptation</strong> is missing. Inspection without adaptation is pointless. End every Sprint Review with an explicit “what do we do next?” discussion, and update the Product Backlog in the room: re-order it, add the new insight, remove what no longer matters. If nothing ever changes, also ask whether the right stakeholders are attending.</p>`
  },
  quiz: [
    { q: 'According to the Scrum Guide, what are the three pillars of empiricism?', o: [
      ['Commitment, Focus, Openness', false, 'These are three of the five Scrum Values, not the pillars.'],
      ['Transparency, Inspection, Adaptation', true, 'Transparency enables inspection, and inspection enables adaptation.'],
      ['Plan, Do, Check', false, 'That’s the Deming cycle (PDCA). It’s related in spirit but isn’t Scrum’s wording.'],
      ['Individuals, Interactions, Working software', false, 'Those phrases come from the Agile Manifesto’s values.']
    ] },
    { q: 'Which best describes the relationship between Agile and Scrum?', o: [
      ['They’re the same thing.', false, 'Agile is broader. Kanban, XP and others are also agile approaches.'],
      ['Agile is a set of values and principles. Scrum is one lightweight framework that puts them into practice.', true, 'Scrum is one way of working with an agile mindset.'],
      ['Scrum is the newer version of Agile.', false, 'Scrum (early 1990s) actually predates the 2001 Agile Manifesto.'],
      ['Agile is a tool and Scrum is software.', false, 'Neither is a tool or software.']
    ] },
    { q: 'Which of these is NOT one of the five Scrum Values?', o: [
      ['Courage', false, 'Courage is a Scrum Value: doing the right thing and working on tough problems.'],
      ['Respect', false, 'Respect is a Scrum Value.'],
      ['Velocity', true, 'Velocity isn’t a value, and it doesn’t appear in the Scrum Guide at all. The values are Commitment, Focus, Openness, Respect and Courage.'],
      ['Openness', false, 'Openness is a Scrum Value.']
    ] },
    { q: 'The Scrum Guide calls Scrum “purposefully incomplete”. What does that mean in practice?', o: [
      ['Teams can skip the parts they dislike.', false, 'The Guide says its elements are immutable. Implementing only parts of it is not Scrum.'],
      ['It defines only what’s required to implement Scrum theory. Teams add their own practices, such as user stories or story points, on top.', true, 'The framework is minimal by design. Complementary practices fill in the rest.'],
      ['The Guide is still a draft.', false, 'It’s a finished, versioned document. The current edition is from November 2020.'],
      ['It only works for software.', false, 'The Guide explicitly says Scrum is used across many domains.']
    ] }
  ]
});

LESSONS.push({
  id: 'scrum-2', track: 'scrum', n: 2, minutes: 12,
  title: 'Scrum accountabilities: Product Owner, Scrum Master, Developers', short: 'Accountabilities',
  sub: 'Who is accountable for what in a Scrum Team, and where a PM fits.',
  idea: 'A Scrum Team is one small, self-managing, cross-functional team with three accountabilities: Product Owner, Scrum Master and Developers.',
  body: `
${guide(`<ul>
  <li>A Scrum Team consists of <strong>one Scrum Master, one Product Owner, and Developers</strong>. Within a Scrum Team there are <strong>no sub-teams or hierarchies</strong>. It is a cohesive unit focused on one objective at a time: the Product Goal.</li>
  <li>Teams are <strong>cross-functional</strong> (they have all the skills needed to create value each Sprint) and <strong>self-managing</strong> (they decide internally who does what, when and how).</li>
  <li>The team is small enough to stay nimble and large enough to complete significant work within a Sprint: <strong>typically 10 or fewer people</strong>. Larger groups should split into multiple Scrum Teams that share the same Product Goal, Product Backlog and Product Owner.</li>
  <li>The 2020 Guide uses the word <strong>accountabilities</strong>, not “roles”.</li>
</ul>`)}
<h3>The three accountabilities</h3>
${table(['Accountability', 'Accountable for', 'Key phrases from the Guide'], [
  ['<strong>Developers</strong>', 'Creating the Sprint Backlog (the plan); instilling quality by adhering to the Definition of Done; adapting the plan each day towards the Sprint Goal; holding each other accountable as professionals', 'The people committed to creating <em>any aspect</em> of a usable Increment each Sprint. That includes designers, QA and data scientists, not only coders.'],
  ['<strong>Product Owner</strong>', 'Maximizing the value of the product. Effective Product Backlog management: developing and communicating the Product Goal; creating and communicating backlog items; ordering them; keeping the backlog transparent, visible and understood', 'One person, not a committee. They can delegate the work but remain accountable. Those who want to change the backlog do so by convincing the Product Owner.'],
  ['<strong>Scrum Master</strong>', 'Establishing Scrum as defined in the Guide, and the Scrum Team’s effectiveness. Coaching self-management; causing impediments to be removed; making sure events happen and are positive, productive and within their timebox; serving the PO and the organization', '“True leaders who serve the Scrum Team and the larger organization.”']
])}
<p>For Product Owners to succeed, the Guide says, the entire organization must <strong>respect their decisions</strong>. If the CTO, the Head of Sales and the PM each re-order the backlog, nobody is really the Product Owner.</p>
${practice(`<ul>
  <li><strong>The PM is the PO.</strong> This is the most common setup. The PM job is broader than the PO accountability, covering discovery, pricing input and go-to-market.</li>
  <li><strong>A senior PM or the CTO is the PO, and an APM does much of the backlog work.</strong> This is allowed: the PO may delegate the work and stays accountable. Just make it explicit who has the final say on ordering.</li>
  <li><strong>Engineering managers</strong> aren’t a Scrum accountability. Good EMs support Developers’ growth and engineering health without directing Sprint work.</li>
  <li><strong>The Scrum Master</strong> is often part-time, for example an EM or an experienced engineer. The Guide says a PO or SM who works on Sprint Backlog items participates as a Developer.</li>
  <li>The anti-pattern to avoid is the <strong>proxy PO</strong>: someone who carries the title but has no decision rights, so every decision gets escalated.</li>
</ul>`)}`,
  example: {
    title: 'Mapping your real team onto Scrum',
    html: `
<p>Your setup: the CTO (your manager), you (APM), an engineering lead, four backend and ML engineers, one frontend engineer, one designer, one QA engineer.</p>
${table(['Person', 'Scrum accountability', 'Notes'], [
  ['4 backend/ML engineers, frontend, designer, QA, engineering lead (when building)', '<strong>Developers</strong>', 'Eight people. They own the Sprint plan, and the designer and QA count as Developers.'],
  ['CTO or you', '<strong>Product Owner</strong>', 'Decide this explicitly. If the CTO makes the final ordering calls, the CTO is the PO and you do delegated PO work: refinement, writing items, stakeholder input.'],
  ['Engineering lead or a senior engineer (part-time)', '<strong>Scrum Master</strong>', 'Coaches the team and removes impediments. Avoid making yourself both the de facto PO and the SM: it’s hard to coach a team out of an anti-pattern you are causing.'],
  ['Sales, compliance, ops, partner firms', 'Stakeholders', 'They influence the backlog through the Product Owner.']
])}
<p>Team size: 8 Developers plus a PO and an SM is about 10, which is right at the guidance. If the team grows further, split it into two Scrum Teams sharing one Product Backlog and one PO, rather than growing a 14-person “team”.</p>`
  },
  mistakes: [
    'Treating the PO as a ticket-taker for stakeholders rather than the person who decides the order.',
    'Calling engineers “resources” and assigning their tasks. Developers self-manage the Sprint plan.',
    'Thinking “Developers” means only coders. Designers and QA are Developers too.',
    'Turning the Scrum Master into a meeting scheduler or Jira admin.',
    'Having several people (CTO, sales head, you) quietly acting as PO, each with different priorities.',
    'Splitting one Scrum Team into internal sub-teams (“backend team”, “frontend team”) with hand-offs.'
  ],
  tryit: {
    prompt: `<p><strong>Part 1:</strong> assign each responsibility to the accountability the Scrum Guide gives it to.</p>
<p><strong>Part 2 (box below):</strong> map your real team onto the three accountabilities. Who orders the backlog today? Is that explicit?</p>`,

        ['Coaching team members in self-management and cross-functionality', 1, 'This is one of the ways the Scrum Master serves the Scrum Team.'],
        ['Developing and explicitly communicating the Product Goal', 0, 'This is part of the PO’s Product Backlog management.'],
        ['Causing the removal of impediments to the Scrum Team’s progress', 1, 'The Guide words it as the Scrum Master <em>causing</em> the removal of impediments, not necessarily removing them personally.'],

LESSONS.push({
  id: 'scrum-3', track: 'scrum', n: 3, minutes: 12,
  title: 'Scrum artifacts and their commitments', short: 'Artifacts & commitments',
  sub: 'Product Backlog and Product Goal, Sprint Backlog and Sprint Goal, Increment and Definition of Done.',
  idea: 'Each artifact comes with a commitment that gives it focus. The Product Backlog has the Product Goal, the Sprint Backlog has the Sprint Goal, and the Increment has the Definition of Done.',
  body: `
${fig(DIAG.artifacts, 'The 2020 Scrum Guide pairs every artifact with a commitment.')}
${guide(`<p>Scrum’s artifacts represent work or value and are designed to maximize transparency. Each one contains a commitment that provides focus and something to measure progress against.</p>`)}
<h3>Product Backlog → Product Goal</h3>
<p>The Product Backlog is “an emergent, ordered list of what is needed to improve the product”, and the <strong>single source of work</strong> for the Scrum Team. The <strong>Product Goal</strong> describes a future state of the product that the team can plan against. It sits in the Product Backlog, and the rest of the backlog emerges to define what will fulfil it. It is the team’s long-term objective, and the team must <strong>fulfil or abandon one Product Goal before taking on the next</strong>.</p>
<h3>Sprint Backlog → Sprint Goal</h3>
<p>The Sprint Backlog is made up of the <strong>Sprint Goal (why)</strong>, the <strong>Product Backlog items selected for the Sprint (what)</strong> and an <strong>actionable plan for delivering the Increment (how)</strong>. It is a plan by and for the Developers, updated throughout the Sprint. The <strong>Sprint Goal</strong> is the single objective for the Sprint. It is a commitment by the Developers, but it leaves flexibility in the exact work needed to reach it. If the work turns out differently than expected, the Developers negotiate scope with the Product Owner <strong>without affecting the Sprint Goal</strong>.</p>
<h3>Increment → Definition of Done</h3>
<p>An Increment is a concrete stepping stone towards the Product Goal. It is additive to all prior Increments, thoroughly verified, and <strong>usable</strong>. Several Increments can be created within one Sprint, and an Increment <strong>may be delivered to stakeholders before the Sprint ends</strong>: the Sprint Review is not a gate to releasing value.</p>
<p>The <strong>Definition of Done</strong> is a formal description of the state of the Increment when it meets the quality measures required for the product. The moment an item meets it, an Increment is born. If an item <strong>doesn’t</strong> meet the Definition of Done, it can’t be released or even presented at the Sprint Review. It returns to the Product Backlog for future consideration. If the organization has a DoD standard, every Scrum Team follows it as a minimum.</p>
${practice(`${table(['', 'Definition of Done', 'Acceptance criteria'], [
  ['In the Scrum Guide?', 'Yes, as the Increment’s commitment', 'No. A common complementary practice'],
  ['Applies to', 'Every item and every Increment', 'One specific backlog item'],
  ['Example', '“Code reviewed, tests pass, PII masked in logs, audit entry written”', '“Given no previous meeting, the brief compares the last 90 days”']
])}`)}`,

    title: 'Goals and Done for the AI meeting-prep brief',
    html: `
<p><strong>Product Goal:</strong> “Advisors at partner firms can prepare any client review in under 15 minutes using an AI brief they trust.”</p>
<p><strong>Sprint Goal (Sprint 14):</strong> “Pilot advisors can generate a brief that accurately shows what changed since the last meeting for clients holding mutual funds.” It is one objective, it explains the value, and it leaves the exact scope flexible.</p>
<p><strong>Selected items:</strong> change-since-last-meeting calculation, XIRR display, failed-SIP section, the brief generation endpoint, and audit logging.</p>
<p><strong>Definition of Done (team):</strong></p>
<ul>
  <li>Code reviewed by a second Developer; automated tests pass.</li>
  <li>Golden-set regression: zero numeric mismatches across 50 masked portfolios.</li>
  <li>PII masked in logs and prompts; data stays in approved regions.</li>
  <li>Every AI output logged with prompt version, model version and inputs (audit).</li>
  <li>Compliance-approved disclaimer shown on any AI-generated text.</li>
  <li>p95 latency measured and within budget; accessibility checks pass.</li>

</ul>
<p>Because compliance and quality are in the DoD, “Done” is honest. There’s no hidden “hardening” work waiting before a pilot firm can use it.</p>`
  },

  ],

LESSONS.push({

  title: 'Scrum events', short: 'Events',
  sub: 'The Sprint, Sprint Planning, Daily Scrum, Sprint Review and Sprint Retrospective: purpose, timebox, attendees and output.',
  idea: 'The Sprint is a fixed-length container of one month or less for four events. Each event is a formal chance to inspect and adapt.',
  body: `
${fig(DIAG.scrumCycle, 'One Sprint, end to end. Product Backlog refinement isn’t an event. It happens continuously.')}
${guide(`<ul>
  <li>The <strong>Sprint</strong> is a container for all other events. Sprints are fixed-length events of <strong>one month or less</strong>, and a new Sprint starts immediately after the previous one ends.</li>
  <li>During the Sprint: no changes are made that would endanger the Sprint Goal; quality does not decrease; the Product Backlog is refined as needed; and scope may be clarified and renegotiated with the Product Owner as more is learned.</li>
  <li>A Sprint could be cancelled if the Sprint Goal becomes obsolete. <strong>Only the Product Owner has the authority to cancel the Sprint.</strong></li>
  <li>Events create regularity and reduce the need for meetings not defined in Scrum. Ideally they are held at the same time and place.</li>
</ul>`)}
${table(['Event', 'Purpose', 'Max timebox (1-month Sprint)', 'Who', 'Output'], [
  ['<strong>Sprint Planning</strong>', 'Lay out the work. Three topics: <em>Why</em> is this Sprint valuable? <em>What</em> can be Done? <em>How</em> will the chosen work get done?', '8 hours', 'Entire Scrum Team. Others may be invited to advise.', 'Sprint Backlog: Sprint Goal + selected items + plan'],
  ['<strong>Daily Scrum</strong>', 'Inspect progress towards the Sprint Goal and adapt the Sprint Backlog', '15 minutes, every working day', 'The Developers. PO and SM take part as Developers if they’re working on Sprint Backlog items.', 'An adjusted plan for the next day of work'],
  ['<strong>Sprint Review</strong>', 'Inspect the outcome of the Sprint and decide future adaptations. Progress towards the Product Goal is discussed.', '4 hours', 'Scrum Team + key stakeholders', 'Agreement on what to do next. The Product Backlog may be adjusted.'],
  ['<strong>Sprint Retrospective</strong>', 'Plan ways to increase quality and effectiveness: individuals, interactions, processes, tools and the Definition of Done', '3 hours', 'Scrum Team', 'The most helpful improvements, which may be added to the next Sprint Backlog']
])}
<p>For shorter Sprints, the Guide says the events are “usually shorter”. It gives only the one-month maximums.</p>
<h3>Details people get wrong</h3>
<ul>
  <li>In Sprint Planning, the <strong>whole Scrum Team</strong> collaborates on the Sprint Goal, and it must be finalized before the end of Planning. Developers decide how much to take on. They often break work into pieces of a day or less.</li>
  <li>The 2020 Guide removed the “three questions” from the Daily Scrum. Developers can use any structure, as long as the focus is progress towards the Sprint Goal. It isn’t the only time they can adjust their plan.</li>
  <li>The Sprint Review is a <strong>working session</strong>, and the team should avoid limiting it to a presentation.</li>
  <li>The Retrospective <strong>concludes</strong> the Sprint.</li>
</ul>
${practice(`<ul>
  <li><strong>Two-week Sprints</strong> are the most common choice in industry.</li>
  <li>Scaling the timeboxes roughly in proportion is a common rule of thumb. For a 2-week Sprint that means Planning ≤ 4 h, Review ≤ 2 h, Retro ≤ 1.5 h. This isn’t in the Guide.</li>
  <li>Many teams start Sprints mid-week to avoid Monday holidays and Friday releases.</li>
  <li>Calling the Daily Scrum a “standup” is informal. Standing up isn’t required.</li>
</ul>`)}`,

    html: `
${table(['When', 'Event', 'Notes for you as APM'], [

<p>The next Sprint starts on Wednesday morning. A two-week Sprint keeps feedback from pilot advisors flowing every fortnight.</p>`
  },
  mistakes: [

        ['The team agrees one improvement to its code-review process and adds it to the next Sprint Backlog.', 3, 'The Guide says the most impactful improvements can go straight into the next Sprint Backlog.'],

LESSONS.push({
  id: 'scrum-5', track: 'scrum', n: 5, minutes: 13,
  title: 'Refinement, user stories, story points, velocity and Definition of Ready', short: 'Refinement & estimation',
  sub: 'One of these is in the Scrum Guide and the rest are popular add-ons. Learn which is which and how to use them well.',
  idea: 'Backlog refinement is an ongoing activity in the Scrum Guide. User stories, story points, velocity and Definition of Ready are complementary practices the Guide doesn’t mention, so treat them as tools, not rules.',
  body: `
${guide(`<ul>
  <li>Product Backlog <strong>refinement</strong> is “the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an <strong>ongoing activity</strong> to add details, such as a description, order, and size.”</li>
  <li>“The Developers who will be doing the work are <strong>responsible for the sizing</strong>. The Product Owner may influence the Developers by helping them understand and select trade-offs.”</li>
  <li>Items that can be Done by the Scrum Team within one Sprint are deemed <strong>ready for selection</strong> in Sprint Planning.</li>
  <li>The Guide mentions burn-downs, burn-ups and cumulative flow as forecasting practices that, while useful, “do not replace the importance of empiricism”.</li>
</ul>`)}
<h3>In the Guide or not?</h3>
${table(['Practice', 'In the Scrum Guide?', 'What it is', 'Watch out for'], [
  ['Backlog refinement', '<span class="badge sg">Yes · activity</span>', 'Ongoing work to break down and clarify items', 'It isn’t an event and has no prescribed timebox'],
  ['User stories', '<span class="badge np">No</span>', 'A format from Extreme Programming: “As a…, I want…, so that…”', 'Not every item has to be a story; spikes and bugs are fine'],
  ['Story points', '<span class="badge np">No</span>', 'Relative size estimates (often 1, 2, 3, 5, 8, 13) combining effort, complexity and uncertainty', 'Not hours, and not comparable across teams'],
  ['Velocity', '<span class="badge np">No</span>', 'Points completed per Sprint, used by the team to forecast', 'Becomes useless as soon as it’s a target (Goodhart’s law)'],
  ['Definition of Ready', '<span class="badge np">No</span>', 'A team checklist for items before Sprint Planning', 'Can turn into a stage gate, creating mini-waterfall'],
  ['Planning Poker', '<span class="badge np">No</span>', 'A consensus-based way of estimating', 'Watch for anchoring on the most senior person’s number'],
  ['Daily Scrum “three questions”', '<span class="badge np">Removed in 2020</span>', 'Yesterday / today / blockers', 'Easily becomes a status report']
])}
<h3>Splitting stories well</h3>
<p>Split <strong>vertically</strong>: each slice is thin but works end to end and delivers something usable. Don’t split <strong>horizontally</strong> by layer (“API”, then “UI”, then “testing”), because nothing is usable until every layer lands. Common split patterns: by workflow step, by data variation (mutual funds first, equities later), by business rule, happy path before edge cases, by user role, or a timeboxed <strong>spike</strong> when something is unknown. Check each slice against <strong>INVEST</strong>.</p>
<h3>Using points and velocity sensibly</h3>
<p>If the team completed 27, 31, 29 and 33 points in its last four Sprints, a forecast of <strong>about 30</strong> for the next Sprint is reasonable. Use velocity for forecasting, not as a performance KPI. Teams asked to “increase velocity by 20%” will simply inflate their estimates.</p>`,

    html: `
<p><strong>Horizontal split (avoid this):</strong> “build the OCR service”, “build the extraction API”, “build the UI”, “testing”. Nothing works for an ops user until all four are finished.</p>
<p><strong>Vertical slices:</strong></p>
${table(['Slice', 'Size (points)'], [
  ['1. An ops user uploads a PAN card image, PAN and name are pre-filled, and the user confirms', '5'],
  ['2. Address-proof extraction, with any Aadhaar number masked', '8'],
  ['3. Low-confidence fields are highlighted for manual review', '3'],
  ['4. Bulk upload of up to 50 documents with a progress view', '8'],

], [1])}
<p><strong>Forecast:</strong> the team’s recent velocity is about 30. The PO doesn’t spend the whole Sprint on one epic, so slices 1–3 plus the spike (16 points plus the timebox) are a sensible fit for Sprint 15, alongside other priorities. Slice 4 comes next. Each slice is usable and testable on its own, and slice 1 alone already saves ops time.</p>`

  tryit: {
    prompt: `<p><strong>Part 1:</strong> is each item defined in the Scrum Guide (2020)?</p>
